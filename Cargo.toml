# Copyright (c) 2026 Mike Grier

[workspace]
members = ["crates/acadia", "crates/canopy", "crates/canopy-lock-holder", "crates/komorebi", "crates/test-timers"]
resolver = "3"

[workspace.package]
version = "0.1.0" # x-release-please-version
authors = ["Mike Grier <mjg@grier.tv>"]
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/MikeGrier/canopy"
homepage = "https://github.com/MikeGrier/canopy"
publish = true

[workspace.dependencies]
acadia = { path = "crates/acadia", version = "0.1.0" } # x-release-please-version

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
