[workspace]
members = ["crates/canopy"]
resolver = "2"

[workspace.package]
version = "0.1.0" # x-release-please-version
authors = ["Mike Grier (mjg@grier.tv)"]
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/MikeGrier/canopy"
homepage = "https://github.com/MikeGrier/canopy"
documentation = "https://docs.rs/canopy"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
