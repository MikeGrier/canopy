name: publish-crate

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98
      - name: Verify tag matches every publishable crate version
        run: |
          mismatches="$(cargo metadata --no-deps --format-version 1 | jq -r --arg tag "${GITHUB_REF_NAME}" \
            '.packages[] | select(.publish != []) | select(("v" + .version) != $tag) | "\(.name) \(.version)"')"
          if [ -n "$mismatches" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match crate version(s): ${mismatches}" >&2
            exit 1
          fi
      # Publishes every publishable member in dependency order.
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --locked
