# Copyright (c) Michael Grier.
#
# The full TLA+ sweep and probe run. It runs when a push to main changes something it covers -- the
# specs, their configurations and scenario tables, the tools, or this workflow, which pins TLC --
# and on demand, so an idle repository runs nothing. A burst of pushes is collapsed: one run at a
# time per branch, and a newer pending run replaces an older one of the same branch, so the run that
# starts covers that branch's newest commit.
name: TLA+ sweep

on:
  push:
    branches: [main]
    paths:
      - 'crates/canopy/spec/**'
      - 'tools/**'
      - '.github/workflows/tla-sweep.yml'
  workflow_dispatch:

concurrency:
  # Per ref, so a dispatch on another branch never replaces a pending run for main.
  group: tla-sweep-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install the pinned JDK
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Install the pinned tla2tools.jar
        shell: pwsh
        run: |
          $dir = Join-Path $env:USERPROFILE '.tla\1.8.0'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $jar = Join-Path $dir 'tla2tools.jar'
          Invoke-WebRequest -Uri 'https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar' -OutFile $jar -UseBasicParsing
          $hash = (Get-FileHash -LiteralPath $jar -Algorithm SHA256).Hash
          if ($hash -ne 'E1F11B75C4B5BC4478BA0AC5CB6AE28E40A01B0016BC33E0AA97DA22DFDBCD7F') {
            throw "tla2tools.jar has digest $hash, not the pinned one"
          }

      - name: Probes, then the sweep
        shell: pwsh
        run: |
          $failed = @()
          $specDir = 'crates/canopy/spec'
          foreach ($corpus in Get-ChildItem (Join-Path $specDir 'probes') -Directory | Sort-Object Name) {
            pwsh -NoProfile -File tools/run-probes.ps1 -Spec (Join-Path $specDir "$($corpus.Name).tla") -Parallel 2
            if ($LASTEXITCODE -ne 0) { $failed += "probes of $($corpus.Name)" }
          }
          $specs = Get-ChildItem $specDir -Filter '*.tla' | Where-Object {
            (Test-Path (Join-Path $specDir "$($_.BaseName).cfg")) -or @(Get-ChildItem $specDir -Filter "$($_.BaseName)-*.cfg").Count -gt 0
          } | Sort-Object Name
          foreach ($spec in $specs) {
            pwsh -NoProfile -File tools/run-tlc-all.ps1 -Spec $spec.FullName -Parallel 2
            if ($LASTEXITCODE -ne 0) { $failed += "sweep of $($spec.BaseName)" }
          }
          if ($failed.Count -gt 0) {
            $failed | ForEach-Object { "::error::$_ did not come out as required" }
            exit 1
          }

      - name: Keep TLC's output of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tlc-output
          path: .scratch/tlc/*.out
