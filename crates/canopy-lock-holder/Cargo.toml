[package]
name = "canopy-lock-holder"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Cross-process fixtures for canopy writer exclusion, recovery and discovery. Not published."

[[bin]]
name = "canopy-lock-holder"
path = "src/main.rs"

[[bin]]
name = "vfs-lock-holder"
path = "src/bin/vfs_lock_holder.rs"

[[bin]]
name = "canopy-store-writer"
path = "src/bin/store_writer.rs"

[[bin]]
name = "canopy-contention-bench"
path = "src/bin/contention_bench.rs"

[dependencies]
acadia = { workspace = true, features = ["test-support"] }
canopy = { path = "../canopy" }
contention-sim = { path = "../contention-sim" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Performance"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
test-timers = { path = "../test-timers" }
