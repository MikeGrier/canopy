# Copyright (c) Michael Grier.

[package]
name = "canopy"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
documentation = "https://docs.rs/canopy"
readme = "README.md"
description = "A durable tree-document store with quorum replication and atomic transactions."
exclude = ["PLANS.md", "COMPLETED-CHECKLIST.md", "COMPLETED-PLANS.md", "DESIGN-NOTES.md"]

[dependencies]
acadia.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tracing = "0.1"

[dev-dependencies]
test-timers = { path = "../test-timers" }
komorebi = { path = "../komorebi" }
