\* Negative control: an upgrade unsafe for readers takes the writer tier before
\* the reader tier, so it waits for the reader tier against a handle that holds
\* the reader tier and waits for the writer tier. TLC must report a deadlock.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 0
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = FALSE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    Cyclic = FALSE
    CycleMod = 0
    UpSteps = 0
    Scenario = "UnsafeAndWriter"
    Control = "unsafe-writer-tier-first"
SPECIFICATION Spec
INVARIANTS
    TypeOK
CHECK_DEADLOCK TRUE
