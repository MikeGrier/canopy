    Procs = {1, 2}
    MaxRequests = 0
    MaxDeaths = 1
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 1
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Scenario = "SafeAndReader"
    Control = "none"
SPECIFICATION Spec
PROPERTIES
    Witness_ADeathEndsTheLeases
CHECK_DEADLOCK FALSE
