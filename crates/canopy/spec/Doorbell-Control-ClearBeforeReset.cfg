\* Negative control: The consumer clears the record before it lowers the signal.
\* A wake is lost, so TLC must report AWaiterIsWoken violated.
CONSTANTS
    Producers = {1, 2}
    MaxPublish = 2
    Control = "clear-before-reset"
SPECIFICATION FairSpec
INVARIANTS
    TypeOK
PROPERTIES
    AWaiterIsWoken
CHECK_DEADLOCK FALSE
