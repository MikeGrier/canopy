CONSTANTS
    NPtr = 3
    NBlob = 2
    Versions = {"A", "B", "C"}
    Initial = "A"
    MaxWrites = 2
    MaxCrashes = 1
    SyncBeforeCollect = TRUE
    Fix = "record"
    RecordDetail = TRUE
    LoggedWrites = TRUE
    Maintenance = TRUE
    Control = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    DurablePointerHasBlob
    LivePointerHasBlob
    IdleImpliesSettledUnlessAReplicaIsLost
    ACheckReadsASettledRecord
PROPERTIES
    PointersMoveOnlyUnderADurableRecord
    TheRecordGoesOnlyOnceItsVersionIsDurable
    RepairOnlyFillsAMissingReplicaWithTheVote
CHECK_DEADLOCK FALSE
