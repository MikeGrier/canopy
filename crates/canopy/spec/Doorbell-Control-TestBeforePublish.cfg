\* Negative control: A producer tests the record before it publishes its work.
\* A wake is lost, so TLC must report AWaiterIsWoken violated.
CONSTANTS
    Producers = {1, 2}
    MaxPublish = 2
    Control = "test-before-publish"
SPECIFICATION FairSpec
INVARIANTS
    TypeOK
PROPERTIES
    AWaiterIsWoken
CHECK_DEADLOCK FALSE
