\* STRANDED-VOTE: no operation in progress implies a pointer majority (a version
\* or absence). The protocol as built, the "record" guard beside writes that a
\* transaction makes: every invariant and property holds.
CONSTANTS
    NPtr = 3
    NBlob = 2
    Versions = {"A", "B", "C"}
    Initial = "A"
    MaxWrites = 2
    MaxCrashes = 1
    SyncBeforeCollect = TRUE
    Fix = "record"
    RecordDetail = TRUE
    LoggedWrites = TRUE
    Maintenance = FALSE
    Control = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    DurablePointerHasBlob
    LivePointerHasBlob
    IdleImpliesSettled
PROPERTIES
    PointersMoveOnlyUnderADurableRecord
    TheRecordGoesOnlyOnceItsVersionIsDurable
CHECK_DEADLOCK FALSE
