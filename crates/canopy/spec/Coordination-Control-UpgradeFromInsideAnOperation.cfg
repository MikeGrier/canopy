\* Negative control: an upgrade is started from inside an operation of its own
\* handle -- a callback during a read -- so its drain waits for a lease that
\* cannot end while the call is blocked. TLC must report a deadlock.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 0
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 1
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = FALSE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Scenario = "SafeAndReader"
    Control = "upgrade-from-inside-an-operation"
SPECIFICATION Spec
INVARIANTS
    TypeOK
CHECK_DEADLOCK TRUE
