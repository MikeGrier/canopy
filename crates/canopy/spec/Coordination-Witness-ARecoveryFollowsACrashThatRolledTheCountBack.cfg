\* Witness: recovery starts over a prepared transaction after a host crash that rolled the count back to an even value.
\* TLC must report Witness_ARecoveryFollowsACrashThatRolledTheCountBack violated, which shows it is reachable.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 2
    MaxDeaths = 0
    MaxCrashes = 1
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    Cyclic = FALSE
    CycleMod = 0
    UpSteps = 0
    Scenario = "Plain2"
    Control = "none"
SPECIFICATION Spec
PROPERTIES
    Witness_ARecoveryFollowsACrashThatRolledTheCountBack
CHECK_DEADLOCK FALSE
