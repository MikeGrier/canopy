\* Negative control: the namespace is changed before the prepare record is
\* written, so a failure leaves a visible change that rolling back cannot undo.
\* TLC must report TheNamespaceMovesOnlyAfterPrepare violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 1
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "Plain2"
    Control = "apply-before-prepare"
SPECIFICATION Spec
PROPERTIES
    TheNamespaceMovesOnlyAfterPrepare
CHECK_DEADLOCK FALSE
