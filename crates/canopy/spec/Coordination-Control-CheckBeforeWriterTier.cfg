\* Negative control: a handle is checked before it waits for the writer tier and
\* not again, so an upgrade can complete between the check and the attachment.
\* TLC must report AdmittedHandlesAreAdmissible violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 0
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "SafeAndWriter"
    Control = "check-before-writer-tier"
SPECIFICATION Spec
PROPERTIES
    AdmittedHandlesAreAdmissible
CHECK_DEADLOCK FALSE
