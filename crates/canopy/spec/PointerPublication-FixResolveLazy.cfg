\* STRANDED-VOTE candidate guard "resolve-lazy" fails: live unanimity says nothing
\* about the durable replicas, so a crash after a skipped resolve exposes three
\* values. TLC must report IdleImpliesSettled violated.
CONSTANTS
    NPtr = 3
    NBlob = 2
    Versions = {"A", "B", "C"}
    Initial = "A"
    MaxWrites = 2
    MaxCrashes = 1
    SyncBeforeCollect = TRUE
    Fix = "resolve-lazy"
    RecordDetail = FALSE
    LoggedWrites = FALSE
    Maintenance = FALSE
    Control = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    DurablePointerHasBlob
    LivePointerHasBlob
    IdleImpliesSettled
CHECK_DEADLOCK FALSE
