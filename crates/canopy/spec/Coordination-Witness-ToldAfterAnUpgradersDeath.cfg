\* Witness: an upgrader dies in its body and the next acquirer, a writer that speaks the target schema, is told recovery is required.
\* TLC must report Witness_ToldAfterAnUpgradersDeath violated, which shows it is reachable.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 2
    MaxDeaths = 1
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 1
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 2
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "SafeAndTargetWriter"
    Control = "none"
SPECIFICATION Spec
INVARIANTS
    Witness_ToldAfterAnUpgradersDeath
CHECK_DEADLOCK FALSE
