\* Witness: an upgrader that was told recovery is required lets go of exclusion, its upgrade refused and its handle detached.
\* TLC must report Witness_AToldUpgraderIsDetached violated, which shows it is reachable.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 2
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 1
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 2
    Callbacks = FALSE
    Scenario = "SafeAndWriter"
    Control = "none"
SPECIFICATION Spec
PROPERTIES
    Witness_AToldUpgraderIsDetached
CHECK_DEADLOCK FALSE
