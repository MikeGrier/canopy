\* Negative control: an upgrade with a body that is unsafe for readers raises the oldest
\* reader schema of every layer and not only its own. TLC must report
\* AnUpgradeOfOneLayerLeavesTheOthersAlone violated.
CONSTANTS
    Procs = {1, 2, 3}
    MaxRequests = 0
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 1
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 1
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "TwoLayersUnsafe"
    Control = "unsafe-upgrade-raises-every-layer"
SPECIFICATION Spec
PROPERTIES
    AnUpgradeOfOneLayerLeavesTheOthersAlone
CHECK_DEADLOCK FALSE
