\* Negative control: A resumer does not compare its inputs with the reservation's, and resumes a creation with different inputs.
\* TLC must report ACreatorUsesTheReservedInputs violated.
CONSTANTS
    Procs = {1, 2}
    NArt = 2
    MaxDeaths = 1
    MaxCrashes = 0
    Intrusion = FALSE
    Scenario = "DifferentInputs"
    Control = "resume-ignores-inputs"
SPECIFICATION Spec
INVARIANTS
    ACreatorUsesTheReservedInputs
CHECK_DEADLOCK FALSE
