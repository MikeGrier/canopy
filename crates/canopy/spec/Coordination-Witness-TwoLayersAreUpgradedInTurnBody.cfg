\* Witness: an upgrade of one layer through its body completes after an upgrade of another layer has completed.
\* TLC must report Witness_TwoLayersAreUpgradedInTurn violated, which shows it is reachable.
CONSTANTS
    Procs = {1, 2, 3}
    MaxRequests = 0
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 2
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 1
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "TwoLayerUpgradesSafe"
    Control = "none"
SPECIFICATION Spec
PROPERTIES
    Witness_TwoLayersAreUpgradedInTurn
CHECK_DEADLOCK FALSE
