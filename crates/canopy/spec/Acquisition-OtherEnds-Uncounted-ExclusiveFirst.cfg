\* Acquisition-ExclusiveFirst with every way a wait or a hold ends other than by
\* service and upgrade starts not counted: every invariant and property holds.
CONSTANTS
    Scenario = "UnsafeAndTwoReaders"
    MaxUpgrades = 1
    ExclusiveFirst = TRUE
    CountUpgrades = FALSE
    Escapes = TRUE
    Refusals = TRUE
    Deaths = TRUE
SPECIFICATION ContractSpec
INVARIANTS
    TypeOK
    OneWriterAtATime
    GateIsExclusive
    TiersAreExclusive
PROPERTIES
    AWaitingUpgraderIsServed
CHECK_DEADLOCK TRUE
