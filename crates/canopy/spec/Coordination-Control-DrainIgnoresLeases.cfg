\* Negative control: an upgrader begins converting without waiting for the
\* leases on its handle to end, so an operation runs beneath the conversion.
\* TLC must report NoLeaseIsHeldOnceAConversionBegins violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 0
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 1
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    Cyclic = FALSE
    CycleMod = 0
    UpSteps = 0
    Scenario = "SafeAndReader"
    Control = "drain-ignores-leases"
SPECIFICATION Spec
INVARIANTS
    NoLeaseIsHeldOnceAConversionBegins
CHECK_DEADLOCK FALSE
