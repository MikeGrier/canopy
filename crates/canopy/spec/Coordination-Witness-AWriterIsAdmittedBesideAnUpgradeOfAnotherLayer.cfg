\* Witness: a handle that may write, speaks the target of the layer whose upgrade its upgrader left interrupted and the current schema of the other layer, and is admitted.
\* TLC must report Witness_AWriterIsAdmittedBesideAnUpgradeOfAnotherLayer violated, which shows it is reachable.
CONSTANTS
    Procs = {1, 2, 3}
    MaxRequests = 0
    MaxDeaths = 1
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "TwoLayersSafe"
    Control = "none"
SPECIFICATION Spec
PROPERTIES
    Witness_AWriterIsAdmittedBesideAnUpgradeOfAnotherLayer
CHECK_DEADLOCK FALSE
