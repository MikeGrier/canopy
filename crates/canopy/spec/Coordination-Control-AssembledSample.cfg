\* Negative control: a sample of the count is assembled from two parts read
\* in two steps, so it can be a value the count never held and a torn read
\* can be classified as settled. TLC must report
\* SettledReadSawNoPartOfAnOperation violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 2
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 1
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    Cyclic = FALSE
    CycleMod = 0
    UpSteps = 0
    Scenario = "Plain2"
    Control = "assembled-sample"
SPECIFICATION Spec
PROPERTIES
    SettledReadSawNoPartOfAnOperation
CHECK_DEADLOCK FALSE
