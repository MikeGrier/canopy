\* Witness: three requests end in three different unserved outcomes -- refused, withdrawn, and dead with its process while waiting.
\* TLC must report Witness_AllThreeUnservedOutcomes violated, which shows it is reachable.
CONSTANTS
    Procs = {1, 2, 3}
    MaxRequests = 3
    MaxDeaths = 1
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Scenario = "Plain3"
    Control = "none"
SPECIFICATION Spec
INVARIANTS
    Witness_AllThreeUnservedOutcomes
CHECK_DEADLOCK FALSE
