\* Negative control: an upgrader keeps its registry entry through the conversion
\* that detaches it, so an entry exists while its handle is not attached. TLC must
\* report EntriesFollowAttachment violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 0
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 2
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Scenario = "SafeAndReader"
    Control = "entry-follows-the-handles-life"
SPECIFICATION Spec
INVARIANTS
    EntriesFollowAttachment
CHECK_DEADLOCK FALSE
