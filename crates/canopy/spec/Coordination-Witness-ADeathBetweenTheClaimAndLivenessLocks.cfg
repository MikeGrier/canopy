\* Witness: a handle dies holding an entry claim lock and before it has taken the liveness lock.
\* TLC must report Witness_ADeathBetweenTheClaimAndLivenessLocks violated, which shows it is reachable.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 0
    MaxDeaths = 1
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 1
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Scenario = "Plain2"
    Control = "none"
SPECIFICATION Spec
PROPERTIES
    Witness_ADeathBetweenTheClaimAndLivenessLocks
CHECK_DEADLOCK FALSE
