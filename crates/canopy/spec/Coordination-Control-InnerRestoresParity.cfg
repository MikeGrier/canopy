\* Negative control: an operation nested under a hold raises the count when
\* it ends, restoring even parity while the outer operation is open. TLC must
\* report CountIsOddWhileAnOperationIsUnresolved violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 1
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    Cyclic = FALSE
    CycleMod = 0
    UpSteps = 0
    Scenario = "Plain2"
    Control = "inner-restores-parity"
SPECIFICATION Spec
INVARIANTS
    CountIsOddWhileAnOperationIsUnresolved
CHECK_DEADLOCK FALSE
