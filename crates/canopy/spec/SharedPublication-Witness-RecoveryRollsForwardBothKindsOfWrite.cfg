    MaxDeaths = 1
    MaxCrashes = 1
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = FALSE
    Txn = FALSE
    UnloggedRecovery = TRUE
    MixedWrites = TRUE
    Cyclic = FALSE
    CycleMod = 0
    UpSteps = 0
    Scenario = "Plain2"
    Control = "none"
    Docs = {1, 2}
    NPtr = 3
    NBlob = 1
    Fix = "record"
    PubControl = "none"
SPECIFICATION SpSpec
INVARIANTS
    Witness_RecoveryRollsForwardBothKindsOfWrite
CHECK_DEADLOCK FALSE
