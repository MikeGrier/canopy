\* Negative control: a callback waits until nobody holds exclusion, which its own holder does,
\* so it waits forever. TLC must report a deadlock.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 1
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = FALSE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = TRUE
    Notifications = FALSE
    Scenario = "Plain2"
    Control = "callback-waits-for-exclusion"
SPECIFICATION Spec
CHECK_DEADLOCK TRUE
