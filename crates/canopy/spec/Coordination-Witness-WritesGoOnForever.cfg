\* Witness: with two writers that go on writing and attaching forever, writes go on
\* forever. TLC must report Witness_WritesGoOnForever violated, which shows it is reachable.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 2
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = FALSE
    Txn = FALSE
    UnloggedRecovery = TRUE
    MixedWrites = FALSE
    Cyclic = TRUE
    CycleMod = 4
    UpSteps = 0
    Scenario = "Plain2"
    Control = "none"
SPECIFICATION Spec
PROPERTIES
    Witness_WritesGoOnForever
CHECK_DEADLOCK TRUE
