\* Witness: a holder dies while its closing raise of the count is prepared and not yet published, and the next acquirer is told recovery is required.
\* TLC must report Witness_ToldAfterDeathWhileClosingIsPublished violated, which shows it is reachable.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 3
    MaxDeaths = 1
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Scenario = "Plain2"
    Control = "none"
SPECIFICATION Spec
INVARIANTS
    Witness_ToldAfterDeathWhileClosingIsPublished
CHECK_DEADLOCK FALSE
