\* Negative control: A resumer does not take the creation exclusion, so it creates without holding it.
\* TLC must report ExclusionMatchesHolders violated.
CONSTANTS
    Procs = {1, 2}
    NArt = 2
    MaxDeaths = 0
    MaxCrashes = 0
    Intrusion = FALSE
    Scenario = "TwoCreators"
    Control = "resume-without-exclusion"
SPECIFICATION Spec
INVARIANTS
    ExclusionMatchesHolders
CHECK_DEADLOCK FALSE
