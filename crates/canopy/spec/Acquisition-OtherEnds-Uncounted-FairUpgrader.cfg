\* Acquisition-FairUpgrader with every way a wait or a hold ends other than by
\* service and upgrade starts not counted: every invariant and property holds.
CONSTANTS
    Scenario = "UnsafeAndReader"
    MaxUpgrades = 1
    ExclusiveFirst = FALSE
    CountUpgrades = FALSE
    Escapes = TRUE
    Refusals = TRUE
    Deaths = TRUE
SPECIFICATION FairSpec
INVARIANTS
    TypeOK
    OneWriterAtATime
    GateIsExclusive
    TiersAreExclusive
PROPERTIES
    AWaitingUpgraderIsServed
CHECK_DEADLOCK TRUE
