\* With strong fairness on the upgrader's takes an upgrader can still be passed over
\* forever by two readers whose shared holds of the gate overlap, so the gate is never free.
\* TLC must report AWaitingUpgraderIsServed violated.
CONSTANTS
    Procs = {1, 2, 3}
    MaxRequests = 2
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = FALSE
    Txn = FALSE
    UnloggedRecovery = TRUE
    MixedWrites = FALSE
    Cyclic = TRUE
    CycleMod = 4
    UpSteps = 0
    Scenario = "UnsafeAndTwoReaders"
    Control = "none"
SPECIFICATION UpgraderFairSpec
PROPERTIES
    AWaitingUpgraderIsServed
CHECK_DEADLOCK TRUE
