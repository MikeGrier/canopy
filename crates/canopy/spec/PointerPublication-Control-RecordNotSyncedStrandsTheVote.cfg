\* Negative control: The pointer replicas are renamed before the record is made durable, and a crash loses it.
\* TLC must report IdleImpliesSettled violated.
CONSTANTS
    NPtr = 3
    NBlob = 2
    Versions = {"A", "B", "C"}
    Initial = "A"
    MaxWrites = 2
    MaxCrashes = 1
    SyncBeforeCollect = TRUE
    Fix = "record"
    RecordDetail = TRUE
    LoggedWrites = FALSE
    Maintenance = FALSE
    Control = "record-not-synced"
SPECIFICATION Spec
INVARIANTS
    IdleImpliesSettled
CHECK_DEADLOCK FALSE
