\* Under the contract's fairness a writer can be passed over forever by another writer that
\* is granted exclusion each time it frees. TLC must report AWaitingWriterIsServed violated.
CONSTANTS
    Scenario = "Writers2"
    MaxUpgrades = 1
    ExclusiveFirst = FALSE
    CountUpgrades = TRUE
    Escapes = FALSE
    Refusals = FALSE
    Deaths = FALSE
SPECIFICATION ContractSpec
INVARIANTS
    TypeOK
    OneWriterAtATime
    GateIsExclusive
    TiersAreExclusive
PROPERTIES
    AWaitingWriterIsServed
CHECK_DEADLOCK TRUE
