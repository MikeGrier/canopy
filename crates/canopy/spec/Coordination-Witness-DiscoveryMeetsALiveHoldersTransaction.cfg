\* Witness: discovery runs while a live holder is in the middle of a transaction and reports recovery as not required.
\* TLC must report Witness_DiscoveryMeetsALiveHoldersTransaction violated, which shows it is reachable.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 1
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 1
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "Plain2"
    Control = "none"
SPECIFICATION Spec
PROPERTIES
    Witness_DiscoveryMeetsALiveHoldersTransaction
CHECK_DEADLOCK FALSE
