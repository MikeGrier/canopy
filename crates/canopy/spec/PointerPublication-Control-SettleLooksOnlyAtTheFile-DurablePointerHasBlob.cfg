\* Negative control: A settle fsyncs the record only when the file shows one, so a stale durable record is not seen.
\* TLC must report DurablePointerHasBlob violated.
CONSTANTS
    NPtr = 3
    NBlob = 2
    Versions = {"A", "B", "C"}
    Initial = "A"
    MaxWrites = 2
    MaxCrashes = 1
    SyncBeforeCollect = TRUE
    Fix = "record"
    RecordDetail = TRUE
    LoggedWrites = TRUE
    Maintenance = FALSE
    Control = "settle-looks-only-at-the-file"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    DurablePointerHasBlob
CHECK_DEADLOCK FALSE
