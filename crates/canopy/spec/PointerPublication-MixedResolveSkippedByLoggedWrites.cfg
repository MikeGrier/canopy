\* Copyright (c) Michael Grier.
\* The "resolve" guard, which a transaction's write of the document does not run:
\* every invariant and property holds, since the transaction's own recovery restores
\* the pointer majority.
CONSTANTS
    NPtr = 3
    NBlob = 2
    Versions = {"A", "B", "C"}
    Initial = "A"
    MaxWrites = 2
    MaxCrashes = 1
    SyncBeforeCollect = TRUE
    Fix = "resolve"
    RecordDetail = FALSE
    LoggedWrites = TRUE
    Maintenance = FALSE
    Control = "logged-write-skips-the-guard"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    DurablePointerHasBlob
    LivePointerHasBlob
    IdleImpliesSettled
CHECK_DEADLOCK FALSE
