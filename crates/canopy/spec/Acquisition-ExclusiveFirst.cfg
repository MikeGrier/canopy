\* Under the contract's fairness alone, with shared admission withheld while an upgrader
\* waits for the gate, an upgrader beside two readers is served: every invariant and property
\* holds.
CONSTANTS
    Scenario = "UnsafeAndTwoReaders"
    MaxUpgrades = 1
    ExclusiveFirst = TRUE
SPECIFICATION ContractSpec
INVARIANTS
    TypeOK
    OneWriterAtATime
    GateIsExclusive
    TiersAreExclusive
PROPERTIES
    AWaitingUpgraderIsServed
    AnAttachingHandleIsServed
CHECK_DEADLOCK TRUE
