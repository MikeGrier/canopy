\* Negative control: recovery of an unlogged write publishes the even count before it has
\* made the store whole. TLC must report
\* RecoveryPublishesTheCountOnlyOnceTheStoreIsSettled violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 1
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = TRUE
    MixedWrites = FALSE
    Cyclic = FALSE
    CycleMod = 0
    UpSteps = 0
    Scenario = "Plain2"
    Control = "count-published-before-the-namespace-is-whole"
SPECIFICATION Spec
PROPERTIES
    RecoveryPublishesTheCountOnlyOnceTheStoreIsSettled
CHECK_DEADLOCK FALSE
