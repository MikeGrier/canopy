\* Negative control: a failure after the prepare record may have been written is
\* handled as one before it, with the staging swept and the log reset, which leaves a
\* half-applied namespace with nothing to say so. TLC must report
\* UnresolvedWorkIsNeverInvisible violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 1
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Scenario = "Plain2"
    Control = "failure-after-prepare-is-rolled-back"
SPECIFICATION Spec
INVARIANTS
    UnresolvedWorkIsNeverInvisible
CHECK_DEADLOCK FALSE
