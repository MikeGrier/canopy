\* Witness: an upgrade unsafe for readers holds its tiers beside a writer and a reader. TLC
\* must report Witness_AnUpgradeHoldsItsTiers violated, which shows it is reachable.
CONSTANTS
    Scenario = "UnsafeWriterReader"
    MaxUpgrades = 1
    ExclusiveFirst = FALSE
    CountUpgrades = TRUE
    Escapes = FALSE
    Refusals = FALSE
    Deaths = FALSE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    OneWriterAtATime
    GateIsExclusive
    TiersAreExclusive
    Witness_AnUpgradeHoldsItsTiers
CHECK_DEADLOCK TRUE
