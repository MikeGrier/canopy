\* Witness: an upgrader that holds exclusion ends its operation before it records the intent, leaving nothing behind.
\* TLC must report Witness_AnUpgraderGivesUpBeforeTheIntent violated, which shows it is reachable.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 1
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 1
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 2
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "SafeAndTargetWriter"
    Control = "none"
SPECIFICATION Spec
PROPERTIES
    Witness_AnUpgraderGivesUpBeforeTheIntent
CHECK_DEADLOCK FALSE
