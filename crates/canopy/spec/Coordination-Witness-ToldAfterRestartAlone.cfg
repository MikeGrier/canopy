\* Witness: after a host restart alone -- no process died holding exclusion and the fence was never set -- an acquirer is told recovery is required.
\* TLC must report Witness_ToldAfterRestartAlone violated, which shows it is reachable.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 3
    MaxDeaths = 0
    MaxCrashes = 1
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Scenario = "Plain2"
    Control = "none"
SPECIFICATION Spec
INVARIANTS
    Witness_ToldAfterRestartAlone
CHECK_DEADLOCK FALSE
