\* Negative control: a process need never take its own steps, so what it holds it can hold
\* forever. TLC must report ADetachCompletes violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 0
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 1
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "SafeAndReader"
    Control = "none"
SPECIFICATION HoldSpecWithoutOwnSteps
PROPERTIES
    ADetachCompletes
CHECK_DEADLOCK FALSE
