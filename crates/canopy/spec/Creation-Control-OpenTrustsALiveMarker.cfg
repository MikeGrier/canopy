\* Negative control: An open relies on a marker its creator died before making durable, which a host crash can then take away.
\* TLC must report AnOpenedStoreKeepsItsMarker violated.
CONSTANTS
    Procs = {1, 2, 3}
    NArt = 2
    MaxDeaths = 1
    MaxCrashes = 0
    Intrusion = FALSE
    Scenario = "CreatorAndOpeners"
    Control = "open-trusts-a-live-marker"
SPECIFICATION Spec
INVARIANTS
    AnOpenedStoreKeepsItsMarker
CHECK_DEADLOCK FALSE
