\* Witness: Recovery rolls forward the record of the second document.
\* TLC must report Witness_ARecoverySettlesARecordOfTheSecondDocument violated, which shows it is reachable.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 18
    MaxWrites = 2
    RecoverySchedule = "all"
    InitialDirectoryDebt = 0
    InitialNodeRemoved = FALSE
    TransactionPreconditions = "unconditional"
    MaxTerminations = 1
    MaxCrashes = 1
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = FALSE
    Txn = FALSE
    UnloggedRecovery = TRUE
    MixedWrites = FALSE
    PublicationsFail = TRUE
    CrashFences = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "Plain2"
    Control = "none"
    Docs = {1, 2}
    NPtr = 3
    NBlob = 1
    Fix = "record"
    PubControl = "none"
SPECIFICATION QuotientSpec
CONSTRAINT WritesBounded
VIEW QuotientView
INVARIANTS
    Witness_ARecoverySettlesARecordOfTheSecondDocument
    OnlyOrdinaryRequestsConsumeTheBudget
CHECK_DEADLOCK FALSE
