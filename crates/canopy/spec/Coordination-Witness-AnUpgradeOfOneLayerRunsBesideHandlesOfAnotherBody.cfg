\* Witness: a handle that speaks an older schema of one layer is admitted while an upgrade with a body of another layer is in progress.
\* TLC must report Witness_AnUpgradeOfOneLayerRunsBesideHandlesOfAnother violated, which shows it is reachable.
CONSTANTS
    Procs = {1, 2, 3}
    MaxRequests = 0
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 1
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    Cyclic = FALSE
    CycleMod = 0
    UpSteps = 1
    Scenario = "TwoLayersSafe"
    Control = "none"
SPECIFICATION Spec
PROPERTIES
    Witness_AnUpgradeOfOneLayerRunsBesideHandlesOfAnother
CHECK_DEADLOCK FALSE
