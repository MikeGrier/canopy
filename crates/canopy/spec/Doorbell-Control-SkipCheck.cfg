\* Negative control: The consumer waits after clearing without checking again.
\* A wake is lost, so TLC must report AWaiterIsWoken violated.
CONSTANTS
    Producers = {1, 2}
    MaxPublish = 2
    Control = "skip-check"
SPECIFICATION FairSpec
INVARIANTS
    TypeOK
PROPERTIES
    AWaiterIsWoken
CHECK_DEADLOCK FALSE
