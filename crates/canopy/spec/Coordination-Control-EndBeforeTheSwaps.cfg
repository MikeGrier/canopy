\* Negative control: the end record is written before every swap has landed, so
\* a transaction reads as finished while the namespace is half applied. TLC must
\* report AnEndRecordFollowsEverySwap violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 1
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "Plain2"
    Control = "end-before-the-swaps"
SPECIFICATION Spec
PROPERTIES
    AnEndRecordFollowsEverySwap
CHECK_DEADLOCK FALSE
