\* Negative control: With no guard, recovery does nothing for the documents, and a write that fails part-way over one that did leaves no majority.
\* TLC must report EveryDocumentHasAMajority violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 2
    MaxDeaths = 1
    MaxCrashes = 1
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = FALSE
    Txn = FALSE
    UnloggedRecovery = TRUE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Scenario = "Plain2"
    Control = "none"
    Docs = {1, 2}
    NPtr = 3
    NBlob = 1
    Fix = "none"
    PubControl = "none"
SPECIFICATION SpSpec
INVARIANTS
    SpTypeOK
    EveryDocumentHasAMajority
CHECK_DEADLOCK FALSE
