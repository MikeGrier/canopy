\* Negative control: Under the "record" guard an acquirer that finds an abandoned ownership record replaces it without setting the fence, and the next acquirer after it is not told.
\* TLC must report AHealthyHolderFindsEveryDocumentSettled violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 3
    MaxDeaths = 1
    MaxCrashes = 1
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = FALSE
    Txn = FALSE
    UnloggedRecovery = TRUE
    MixedWrites = FALSE
    Cyclic = FALSE
    CycleMod = 0
    UpSteps = 0
    Scenario = "Plain2"
    Control = "replace-without-fence"
    Docs = {1, 2}
    NPtr = 3
    NBlob = 1
    Fix = "record"
    PubControl = "none"
SPECIFICATION SpSpec
INVARIANTS
    SpTypeOK
    AHealthyHolderFindsEveryDocumentSettled
CHECK_DEADLOCK FALSE
