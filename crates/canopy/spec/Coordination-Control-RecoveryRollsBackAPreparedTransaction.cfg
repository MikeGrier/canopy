\* Negative control: recovery rolls a prepared transaction back instead of forward,
\* discarding a commit the log says was reached. TLC must report
\* AResetNeverDiscardsAPreparedTransaction violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 1
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    Cyclic = FALSE
    CycleMod = 0
    UpSteps = 0
    Scenario = "Plain2"
    Control = "recovery-rolls-back-a-prepared-transaction"
SPECIFICATION Spec
PROPERTIES
    AResetNeverDiscardsAPreparedTransaction
CHECK_DEADLOCK FALSE
