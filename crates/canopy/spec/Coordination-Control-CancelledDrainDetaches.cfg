\* Negative control: cancelling a drain detaches the handle, so operations in
\* flight on its clones lose their attachment. TLC must report
\* ACancelledDrainLeavesTheHandleAttached violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 0
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 1
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "SafeAndReader"
    Control = "cancelled-drain-detaches"
SPECIFICATION Spec
PROPERTIES
    ACancelledDrainLeavesTheHandleAttached
CHECK_DEADLOCK FALSE
