\* Negative control: an acquirer told that recovery is required resets the commit
\* log, which discards the prepared transaction a holder died with. TLC must
\* report AResetNeverDiscardsAPreparedTransaction violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 2
    MaxDeaths = 1
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    Cyclic = FALSE
    CycleMod = 0
    UpSteps = 0
    Scenario = "Plain2"
    Control = "reset-while-recovery-required"
SPECIFICATION Spec
PROPERTIES
    AResetNeverDiscardsAPreparedTransaction
CHECK_DEADLOCK FALSE
