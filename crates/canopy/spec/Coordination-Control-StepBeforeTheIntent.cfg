\* Copyright (c) Michael Grier.
\* Negative control: a migration step is made before the upgrade intent is recorded, so an
\* upgrader that dies after it leaves a layer partly migrated with nothing to resume from.
\* TLC must report AMigrationStepIsNeverUnannounced violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 1
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 1
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 2
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "SafeAndTargetWriter"
    Control = "step-before-the-intent"
SPECIFICATION Spec
INVARIANTS
    AMigrationStepIsNeverUnannounced
CHECK_DEADLOCK FALSE
