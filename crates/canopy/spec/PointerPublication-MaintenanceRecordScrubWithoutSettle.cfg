\* Copyright (c) Michael Grier.
\* The "record" guard with a scrub that does not settle a pending record first: every
\* invariant and property holds, because a scrub writes only the vote's version to a
\* replica that has none.
CONSTANTS
    NPtr = 3
    NBlob = 2
    Versions = {"A", "B", "C"}
    Initial = "A"
    MaxWrites = 2
    MaxCrashes = 1
    SyncBeforeCollect = TRUE
    Fix = "record"
    RecordDetail = TRUE
    LoggedWrites = TRUE
    Maintenance = TRUE
    Control = "scrub-skips-the-settle"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    DurablePointerHasBlob
    LivePointerHasBlob
    IdleImpliesSettledUnlessAReplicaIsLost
    ACheckReadsASettledRecord
PROPERTIES
    PointersMoveOnlyUnderADurableRecord
    TheRecordGoesOnlyOnceItsVersionIsDurable
    RepairOnlyFillsAMissingReplicaWithTheVote
CHECK_DEADLOCK FALSE
