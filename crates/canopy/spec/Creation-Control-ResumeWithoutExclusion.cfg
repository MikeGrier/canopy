\* Negative control: A resumer does not take the creation exclusion, and resumes a creation that is still running.
\* TLC must report OneCreationAtATime violated.
CONSTANTS
    Procs = {1, 2}
    NArt = 2
    MaxDeaths = 0
    MaxCrashes = 0
    Intrusion = FALSE
    Scenario = "TwoCreators"
    Control = "resume-without-exclusion"
SPECIFICATION Spec
INVARIANTS
    OneCreationAtATime
CHECK_DEADLOCK FALSE
