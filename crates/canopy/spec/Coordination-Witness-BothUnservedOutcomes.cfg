\* Witness: two requests end in the two unserved outcomes -- withdrawn, and dead with its process while waiting.
\* TLC must report Witness_BothUnservedOutcomes violated, which shows it is reachable.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 2
    MaxTerminations = 1
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    PublicationsFail = TRUE
    CrashFences = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "Plain2"
    Control = "none"
SPECIFICATION Spec
INVARIANTS
    Witness_BothUnservedOutcomes
CHECK_DEADLOCK FALSE
