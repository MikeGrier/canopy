\* Copyright (c) Michael Grier.
\* The "record" guard with unlogged writes by three writers, one of which may die and the
\* host may crash: every invariant and property holds.
\* Tier: milestone.
CONSTANTS
    Procs = {1, 2, 3}
    MaxRequests = 18
    MaxWrites = 2
    RecoverySchedule = "all"
    InitialDirectoryDebt = 0
    MaxTerminations = 1
    MaxCrashes = 1
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = FALSE
    Txn = FALSE
    UnloggedRecovery = TRUE
    MixedWrites = FALSE
    PublicationsFail = TRUE
    CrashFences = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "Plain3"
    Control = "none"
    Docs = {1, 2}
    NPtr = 3
    NBlob = 1
    Fix = "record"
    PubControl = "none"
SPECIFICATION QuotientSpec
CONSTRAINT WritesBounded
VIEW QuotientView
INVARIANTS
    QuotientTypeOK
    DurablePointerHasBlob
    LivePointerHasBlob
    EveryDocumentHasAMajority
    OutcomeIsFixedOnceRecovered
    AHealthyHolderFindsEveryDocumentSettled
    DocumentWorkUsesCurrentGeneration
    SavedRecoveryCountNeverLeads
    StoredVersionsNeverLeadTheGeneration
    OnlyOrdinaryRequestsConsumeTheBudget
PROPERTIES
    OnlyAHolderChangesADocument
CHECK_DEADLOCK FALSE
