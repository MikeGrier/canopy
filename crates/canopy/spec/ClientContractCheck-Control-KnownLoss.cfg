CONSTANTS
    Pairs = {1, 2}
    Commands = {"read", "write"}
    Results = {"ok", "contended"}
    Values = {"initial", "changed"}
    InitialValue = "initial"
    CompletionCapacity = 1
    MaxSubmissions = 3
    Control = "known-loss"
SPECIFICATION CheckSpec
INVARIANTS
    LostCompletionIsUnknown
CHECK_DEADLOCK FALSE
