\* Witness: a recovery completes after an earlier recoverer died between its steps.
\* TLC must report Witness_ARecoveryIsResumedAfterADeath violated, which shows it is reachable.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 2
    MaxDeaths = 1
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "Plain2"
    Control = "none"
SPECIFICATION Spec
PROPERTIES
    Witness_ARecoveryIsResumedAfterADeath
CHECK_DEADLOCK FALSE
