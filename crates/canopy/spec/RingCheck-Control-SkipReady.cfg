\* TLC must report ReadyPairService violated.
\* Negative control: the scheduler starts a later ready pair out of round-robin order.
CONSTANTS
    Pairs = {1, 2}
    CompletionCapacity = 1
    MaxRequests = 3
    Control = "skip-ready"
SPECIFICATION CheckSpec
INVARIANTS
    ReadyPairService
CHECK_DEADLOCK FALSE
