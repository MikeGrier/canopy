\* Negative control: discovery clears a fence it finds set while nobody holds exclusion,
\* which leaves the transaction a failed holder left unresolved with nothing to mark it.
\* TLC must report UnresolvedWorkIsNeverInvisible violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 1
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 1
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    Cyclic = FALSE
    CycleMod = 0
    UpSteps = 0
    Scenario = "Plain2"
    Control = "discovery-clears-the-fence"
SPECIFICATION Spec
INVARIANTS
    UnresolvedWorkIsNeverInvisible
CHECK_DEADLOCK FALSE
