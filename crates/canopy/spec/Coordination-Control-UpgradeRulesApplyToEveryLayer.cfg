\* Negative control: an upgrade of one layer changes what every layer admits and not only its
\* own. TLC must report TheOtherLayersKeepTheirOrdinaryRules violated.
CONSTANTS
    Procs = {1, 2, 3}
    MaxRequests = 0
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    Cyclic = FALSE
    CycleMod = 0
    UpSteps = 0
    Scenario = "TwoLayersSafe"
    Control = "upgrade-rules-apply-to-every-layer"
SPECIFICATION Spec
INVARIANTS
    TheOtherLayersKeepTheirOrdinaryRules
CHECK_DEADLOCK FALSE
