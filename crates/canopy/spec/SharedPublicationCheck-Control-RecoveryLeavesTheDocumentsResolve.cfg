\* Negative control: Under the "resolve" guard recovery does no work on the documents.
\* TLC must report OutcomeIsFixedOnceRecovered violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 18
    MaxWrites = 2
    RecoverySchedule = "all"
    InitialDirectoryDebt = 0
    MaxTerminations = 1
    MaxCrashes = 1
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = FALSE
    Txn = FALSE
    UnloggedRecovery = TRUE
    MixedWrites = FALSE
    PublicationsFail = TRUE
    CrashFences = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "Plain2"
    Control = "none"
    Docs = {1, 2}
    NPtr = 3
    NBlob = 1
    Fix = "resolve"
    PubControl = "recovery-leaves-the-documents"
SPECIFICATION QuotientSpec
CONSTRAINT WritesBounded
VIEW QuotientView
INVARIANTS
    QuotientTypeOK
    OutcomeIsFixedOnceRecovered
    OnlyOrdinaryRequestsConsumeTheBudget
CHECK_DEADLOCK FALSE
