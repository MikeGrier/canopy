\* Negative control: an upgrade unsafe for readers does not take the reader tier
\* exclusively, so it completes with a reader attached. TLC must report
\* AttachedHandlesStayAdmissible violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 0
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "UnsafeAndReader"
    Control = "unsafe-upgrade-leaves-readers"
SPECIFICATION Spec
INVARIANTS
    AttachedHandlesStayAdmissible
CHECK_DEADLOCK FALSE
