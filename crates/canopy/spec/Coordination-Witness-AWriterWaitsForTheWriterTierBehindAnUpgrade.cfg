\* Witness: a handle that may write holds the reader tier and waits for the writer tier while an upgrade holds it.
\* TLC must report Witness_AWriterWaitsForTheWriterTierBehindAnUpgrade violated, which shows it is reachable.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 0
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    Cyclic = FALSE
    CycleMod = 0
    UpSteps = 0
    Scenario = "SafeAndWriter"
    Control = "none"
SPECIFICATION Spec
INVARIANTS
    Witness_AWriterWaitsForTheWriterTierBehindAnUpgrade
CHECK_DEADLOCK FALSE
