\* Negative control: recovery clears the fence when it starts, before the store is settled.
\* TLC must report TheFenceIsClearedOnlyByAFinishedRecovery violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 1
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "Plain2"
    Control = "fence-cleared-at-recovery-start"
SPECIFICATION Spec
PROPERTIES
    TheFenceIsClearedOnlyByAFinishedRecovery
CHECK_DEADLOCK FALSE
