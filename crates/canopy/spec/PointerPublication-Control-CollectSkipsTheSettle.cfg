\* Negative control: A collection pass runs without settling a pending record.
\* TLC must report DurablePointerHasBlob violated.
CONSTANTS
    NPtr = 3
    NBlob = 2
    Versions = {"A", "B", "C"}
    Initial = "A"
    MaxWrites = 2
    MaxCrashes = 1
    SyncBeforeCollect = TRUE
    Fix = "record"
    RecordDetail = TRUE
    LoggedWrites = TRUE
    Maintenance = TRUE
    Control = "collect-skips-the-settle"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    DurablePointerHasBlob
CHECK_DEADLOCK FALSE
