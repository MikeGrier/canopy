\* Negative control: recovery clears the fence when it starts, and a recoverer that stops
\* and lets go leaves a store the next transaction begins over, burying its unresolved
\* work. TLC must report ANewTransactionStartsFromASettledStore violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 2
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    Cyclic = FALSE
    CycleMod = 0
    UpSteps = 0
    Scenario = "Plain2"
    Control = "fence-cleared-at-recovery-start"
SPECIFICATION Spec
PROPERTIES
    ANewTransactionStartsFromASettledStore
CHECK_DEADLOCK FALSE
