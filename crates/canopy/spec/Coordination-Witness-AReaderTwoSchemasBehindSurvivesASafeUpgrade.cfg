\* Witness: a reader of the first source schema stays attached through two upgrades in a row that are safe for readers.
\* TLC must report Witness_AReaderTwoSchemasBehindSurvivesASafeUpgrade violated, which shows it is reachable.
CONSTANTS
    Procs = {1, 2, 3}
    MaxRequests = 0
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    Cyclic = FALSE
    CycleMod = 0
    UpSteps = 0
    Scenario = "ChainSafe"
    Control = "none"
SPECIFICATION Spec
PROPERTIES
    Witness_AReaderTwoSchemasBehindSurvivesASafeUpgrade
CHECK_DEADLOCK FALSE
