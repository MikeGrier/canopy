\* TLC must report PerPairCompletionOrder violated.
\* Negative control: a later request completes before an earlier pending request in its pair.
CONSTANTS
    Pairs = {1, 2}
    Commands = {"read", "write"}
    Results = {"ok", "contended"}
    Values = {"initial", "changed"}
    InitialValue = "initial"
    CompletionCapacity = 2
    MaxSubmissions = 3
    Control = "out-of-order"
SPECIFICATION CheckSpec
INVARIANTS
    PerPairCompletionOrder
CHECK_DEADLOCK FALSE
