\* With strong fairness on each acquisition an upgrader can still be passed over forever by
\* two readers whose shared holds of the gate overlap, so the gate is never free. TLC must report
\* AWaitingUpgraderIsServed violated.
CONSTANTS
    Scenario = "UnsafeAndTwoReaders"
    MaxUpgrades = 1
    ExclusiveFirst = FALSE
SPECIFICATION FairSpec
INVARIANTS
    TypeOK
    OneWriterAtATime
    GateIsExclusive
    TiersAreExclusive
PROPERTIES
    AWaitingUpgraderIsServed
CHECK_DEADLOCK TRUE
