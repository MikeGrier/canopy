\* not only its own. TLC must report TheOtherLayersKeepTheirOrdinaryRules violated.
CONSTANTS
    Procs = {1, 2, 3}
    MaxRequests = 0
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 1
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 1
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "TwoLayersSafe"
    Control = "upgrade-rules-apply-to-every-layer"
SPECIFICATION Spec
INVARIANTS
    TheOtherLayersKeepTheirOrdinaryRules
CHECK_DEADLOCK FALSE
