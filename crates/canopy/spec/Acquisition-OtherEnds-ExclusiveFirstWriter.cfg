\* Acquisition-ExclusiveFirstWriter with every way a wait or a hold ends other than by
\* service: every invariant and property holds.
CONSTANTS
    Scenario = "UnsafeWriterReader"
    MaxUpgrades = 1
    ExclusiveFirst = TRUE
    CountUpgrades = TRUE
    Escapes = TRUE
    Refusals = TRUE
    Deaths = TRUE
SPECIFICATION ContractSpec
INVARIANTS
    TypeOK
    OneWriterAtATime
    GateIsExclusive
    TiersAreExclusive
PROPERTIES
    AWaitingUpgraderIsServed
    StoreMakesProgressOrWaitersLeave
CHECK_DEADLOCK TRUE
