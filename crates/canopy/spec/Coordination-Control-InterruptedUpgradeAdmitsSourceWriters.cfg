\* Negative control: a writer that speaks only the source schema is admitted while an upgrade
\* is interrupted, so it can hold exclusion over a layer that is partly migrated. TLC must
\* report NoHandleThatSpeaksOnlyTheSourceHoldsExclusionDuringAnUpgrade violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 2
    MaxDeaths = 1
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 1
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 2
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "SafeAndWriter"
    Control = "interrupted-upgrade-admits-source-writers"
SPECIFICATION Spec
INVARIANTS
    NoHandleThatSpeaksOnlyTheSourceHoldsExclusionDuringAnUpgrade
CHECK_DEADLOCK FALSE
