\* property holds.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 0
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 1
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Notifications = TRUE
    Scenario = "SafeAndReader"
    Control = "notification-spurious"
SPECIFICATION HoldSpec
PROPERTIES
    ADrainEnds
    AnAdmissionCompletes
    AnUpgradeHoldingItsTiersCompletes
CHECK_DEADLOCK FALSE
