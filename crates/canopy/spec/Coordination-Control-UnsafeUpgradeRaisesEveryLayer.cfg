\* Negative control: an upgrade unsafe for readers raises the oldest reader schema of every
\* layer and not only its own. TLC must report
\* AnUpgradeOfOneLayerLeavesTheOthersAlone violated.
CONSTANTS
    Procs = {1, 2, 3}
    MaxRequests = 0
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    Cyclic = FALSE
    CycleMod = 0
    UpSteps = 0
    Scenario = "TwoLayersUnsafe"
    Control = "unsafe-upgrade-raises-every-layer"
SPECIFICATION Spec
PROPERTIES
    AnUpgradeOfOneLayerLeavesTheOthersAlone
CHECK_DEADLOCK FALSE
