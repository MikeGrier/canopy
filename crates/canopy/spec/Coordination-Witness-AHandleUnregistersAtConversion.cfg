\* Witness: an upgrader leaves the registry when its drain ends, before it releases its tiers.
\* TLC must report Witness_AHandleUnregistersAtConversion violated, which shows it is reachable.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 0
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 1
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "SafeAndReader"
    Control = "none"
SPECIFICATION Spec
PROPERTIES
    Witness_AHandleUnregistersAtConversion
CHECK_DEADLOCK FALSE
