\* Copyright (c) Michael Grier.
\* Negative control: discovery reports recovery required whenever an ownership record is
\* there, so a transaction a live holder is in the middle of is reported as abandoned.
\* TLC must report DiscoveryReportsRequiredOnlyWithCause violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 1
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 1
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    Cyclic = FALSE
    CycleMod = 0
    UpSteps = 0
    Scenario = "Plain2"
    Control = "discovery-trusts-the-ownership-record"
SPECIFICATION Spec
PROPERTIES
    DiscoveryReportsRequiredOnlyWithCause
CHECK_DEADLOCK FALSE
