\* Witness: a drain is cancelled while operations of its clones are in flight and they carry on, the handle still attached.
\* TLC must report Witness_ACancelledDrainLeavesOperationsRunning violated, which shows it is reachable.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 0
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 1
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "SafeAndReader"
    Control = "none"
SPECIFICATION Spec
PROPERTIES
    Witness_ACancelledDrainLeavesOperationsRunning
CHECK_DEADLOCK FALSE
