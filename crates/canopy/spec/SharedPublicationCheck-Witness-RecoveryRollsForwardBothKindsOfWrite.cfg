\* Witness: Under the "record" guard with writes that each choose their form, recovery rolls
\* forward an unlogged write's record and a transaction in one behaviour.
\* TLC must report Witness_RecoveryRollsForwardBothKindsOfWrite violated, which shows it is reachable.
\* Tier: milestone.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 18
    MaxWrites = 2
    RecoverySchedule = "all"
    InitialDirectoryDebt = 0
    InitialNodeRemoved = FALSE
    TransactionPreconditions = "unconditional"
    MaxTerminations = 1
    MaxCrashes = 1
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = FALSE
    Txn = FALSE
    UnloggedRecovery = TRUE
    MixedWrites = TRUE
    PublicationsFail = TRUE
    CrashFences = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "Plain2"
    Control = "none"
    Docs = {1, 2}
    NPtr = 3
    NBlob = 1
    Fix = "record"
    PubControl = "none"
SPECIFICATION QuotientSpec
CONSTRAINT WritesBounded
VIEW QuotientView
INVARIANTS
    Witness_RecoveryRollsForwardBothKindsOfWrite
    OnlyOrdinaryRequestsConsumeTheBudget
CHECK_DEADLOCK FALSE
