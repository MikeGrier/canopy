\* Negative control: recovery of an interrupted upgrade clears the intent and its progress
\* without advancing the schema, which undoes an upgrade that cannot be undone. TLC must
\* report TheIntentClearsOnlyAfterTheSchemaAdvances violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 2
    MaxDeaths = 1
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 1
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 2
    Callbacks = FALSE
    Scenario = "SafeAndTargetWriter"
    Control = "interrupted-upgrade-rolled-back"
SPECIFICATION Spec
PROPERTIES
    TheIntentClearsOnlyAfterTheSchemaAdvances
CHECK_DEADLOCK FALSE
