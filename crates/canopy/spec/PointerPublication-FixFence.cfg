\* STRANDED-VOTE candidate guard "fence" fails: the fence lives in the process, so
\* closing and reopening clears it and the next partial publication strands the
\* vote. TLC must report IdleImpliesSettled violated.
CONSTANTS
    NPtr = 3
    NBlob = 2
    Versions = {"A", "B", "C"}
    Initial = "A"
    MaxWrites = 2
    MaxCrashes = 1
    SyncBeforeCollect = TRUE
    Fix = "fence"
    RecordDetail = FALSE
    LoggedWrites = FALSE
    Maintenance = FALSE
    Control = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    DurablePointerHasBlob
    LivePointerHasBlob
    IdleImpliesSettled
CHECK_DEADLOCK FALSE
