\* Copyright (c) Michael Grier.
\* Negative control: a writer waiting for exclusion loses its notification, so it sleeps on
\* once the lock is free. TLC must report a deadlock.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 2
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = FALSE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Notifications = TRUE
    Scenario = "Plain2"
    Control = "notification-lost"
SPECIFICATION Spec
CHECK_DEADLOCK TRUE
