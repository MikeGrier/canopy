\* Witness: discovery reports recovery required because an upgrader died in its body, which a record under a free lock shows.
\* TLC must report Witness_DiscoveryFindsAnInterruptedUpgrade violated, which shows it is reachable.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 0
    MaxDeaths = 1
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 1
    MaxUpgrades = 1
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 2
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "SafeAndReader"
    Control = "none"
SPECIFICATION Spec
PROPERTIES
    Witness_DiscoveryFindsAnInterruptedUpgrade
CHECK_DEADLOCK FALSE
