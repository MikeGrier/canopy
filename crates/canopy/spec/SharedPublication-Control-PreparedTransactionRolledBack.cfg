\* Negative control: Recovery rolls a prepared transaction back instead of forward from its prepare record.
\* TLC must report AHealthyHolderFindsEveryDocumentSettled violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 2
    MaxDeaths = 1
    MaxCrashes = 1
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = FALSE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Scenario = "Plain2"
    Control = "recovery-rolls-back-a-prepared-transaction"
    Docs = {1, 2}
    NPtr = 3
    NBlob = 1
    Fix = "record"
    PubControl = "none"
SPECIFICATION SpSpec
INVARIANTS
    SpTypeOK
    AHealthyHolderFindsEveryDocumentSettled
CHECK_DEADLOCK FALSE
