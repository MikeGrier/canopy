\* Witness: an upgrade unsafe for readers raises the oldest reader schema together with the schema of the layer.
\* TLC must report Witness_AnUnsafeUpgradeAdvancesTheOldestReaderSchema violated, which shows it is reachable.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 1
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 1
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    Cyclic = FALSE
    CycleMod = 0
    UpSteps = 2
    Scenario = "UnsafeAndReader"
    Control = "none"
SPECIFICATION Spec
PROPERTIES
    Witness_AnUnsafeUpgradeAdvancesTheOldestReaderSchema
CHECK_DEADLOCK FALSE
