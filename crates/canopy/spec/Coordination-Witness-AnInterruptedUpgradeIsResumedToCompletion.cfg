\* TLC must report Witness_AnInterruptedUpgradeIsResumedToCompletion violated, which shows it is reachable.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 2
    MaxDeaths = 1
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 1
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    Cyclic = FALSE
    CycleMod = 0
    UpSteps = 2
    Scenario = "SafeAndTargetWriter"
    Control = "none"
SPECIFICATION Spec
PROPERTIES
    Witness_AnInterruptedUpgradeIsResumedToCompletion
CHECK_DEADLOCK FALSE
