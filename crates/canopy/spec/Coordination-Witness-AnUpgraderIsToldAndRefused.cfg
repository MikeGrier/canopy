\* Witness: an upgrader that takes exclusion after a writer failed unresolved and left is told recovery is required, and does not go on.
\* TLC must report Witness_AnUpgraderIsToldAndRefused violated, which shows it is reachable.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 2
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 1
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 2
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "SafeAndWriter"
    Control = "none"
SPECIFICATION Spec
PROPERTIES
    Witness_AnUpgraderIsToldAndRefused
CHECK_DEADLOCK FALSE
