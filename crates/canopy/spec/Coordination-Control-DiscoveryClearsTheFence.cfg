\* Negative control: discovery clears a fence it finds set while nobody holds exclusion,
\* so asking whether recovery is required changes the answer. TLC must report
\* DiscoveryMutatesNothing violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 1
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 1
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    Cyclic = FALSE
    CycleMod = 0
    UpSteps = 0
    Scenario = "Plain2"
    Control = "discovery-clears-the-fence"
SPECIFICATION Spec
PROPERTIES
    DiscoveryMutatesNothing
CHECK_DEADLOCK FALSE
