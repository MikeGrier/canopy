\* Witness: A write's fsync of the clear fails, and the file is empty while the durable record names the version.
\* TLC must report Witness_AStaleRecordIsLeftByAFailedClear violated, which shows it is reachable.
CONSTANTS
    NPtr = 3
    NBlob = 2
    Versions = {"A", "B", "C"}
    Initial = "A"
    MaxWrites = 2
    MaxCrashes = 1
    SyncBeforeCollect = TRUE
    Fix = "record"
    RecordDetail = TRUE
    LoggedWrites = FALSE
    Maintenance = FALSE
    Control = "none"
SPECIFICATION Spec
INVARIANTS
    Witness_AStaleRecordIsLeftByAFailedClear
CHECK_DEADLOCK FALSE
