\* Negative control: an upgrader told that recovery is required goes on with the upgrade, so
\* it starts from a store that has not been recovered. TLC must report
\* NormalAcquireFindsAHealthyStore violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 2
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 1
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 2
    Callbacks = FALSE
    Scenario = "SafeAndWriter"
    Control = "upgrade-ignores-recovery-required"
SPECIFICATION Spec
PROPERTIES
    NormalAcquireFindsAHealthyStore
CHECK_DEADLOCK FALSE
