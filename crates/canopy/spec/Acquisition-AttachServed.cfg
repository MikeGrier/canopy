\* Under the contract's fairness a handle that waits to attach is admitted, beside writers
\* that go on attaching and writing: every invariant and property holds.
CONSTANTS
    Scenario = "Writers3"
    MaxUpgrades = 1
    ExclusiveFirst = FALSE
SPECIFICATION ContractSpec
INVARIANTS
    TypeOK
    OneWriterAtATime
    GateIsExclusive
    TiersAreExclusive
PROPERTIES
    AnAttachingHandleIsServed
CHECK_DEADLOCK TRUE
