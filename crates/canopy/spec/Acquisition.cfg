\* Under the contract's fairness, with an upgrader unsafe for readers, a writer and a reader,
\* the store makes progress and an upgrade holding its tiers completes: every invariant and
\* property holds.
CONSTANTS
    Scenario = "UnsafeWriterReader"
    MaxUpgrades = 1
    ExclusiveFirst = FALSE
    CountUpgrades = TRUE
    Escapes = FALSE
    Refusals = FALSE
    Deaths = FALSE
SPECIFICATION ContractSpec
INVARIANTS
    TypeOK
    OneWriterAtATime
    GateIsExclusive
    TiersAreExclusive
PROPERTIES
    StoreMakesProgress
    AnUpgradeHoldingItsTiersCompletes
CHECK_DEADLOCK TRUE
