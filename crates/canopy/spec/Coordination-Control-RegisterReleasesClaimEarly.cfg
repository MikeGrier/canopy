\* Copyright (c) Michael Grier.
\* Negative control: a handle lets go of an entry claim lock after it has taken the
\* liveness lock and before it has written its token, so a free claim lock can show
\* a token that is not its liveness holder. TLC must report
\* AFreeClaimShowsTheTokenOfTheLivenessHolder violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 0
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 1
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Scenario = "Plain2"
    Control = "register-releases-claim-early"
SPECIFICATION Spec
INVARIANTS
    AFreeClaimShowsTheTokenOfTheLivenessHolder
CHECK_DEADLOCK FALSE
