CONSTANTS
    Procs = {1, 2}
    MaxRequests = 0
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 1
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    Cyclic = FALSE
    CycleMod = 0
    UpSteps = 0
    Scenario = "Plain2"
