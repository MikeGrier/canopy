\* Negative control: Under the "record" guard an acquirer that finds an abandoned ownership record replaces it without setting the fence, and the next acquirer after it is not told.
\* TLC must report AHealthyHolderFindsEveryDocumentSettled violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 27
    MaxWrites = 3
    RecoverySchedule = "all"
    InitialDirectoryDebt = 0
    MaxTerminations = 1
    MaxCrashes = 1
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = FALSE
    Txn = FALSE
    UnloggedRecovery = TRUE
    MixedWrites = FALSE
    PublicationsFail = TRUE
    CrashFences = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "Plain2"
    Control = "replace-without-fence"
    Docs = {1, 2}
    NPtr = 3
    NBlob = 1
    Fix = "record"
    PubControl = "none"
SPECIFICATION QuotientSpec
CONSTRAINT WritesBounded
VIEW QuotientView
INVARIANTS
    QuotientTypeOK
    AHealthyHolderFindsEveryDocumentSettled
    OnlyOrdinaryRequestsConsumeTheBudget
CHECK_DEADLOCK FALSE
