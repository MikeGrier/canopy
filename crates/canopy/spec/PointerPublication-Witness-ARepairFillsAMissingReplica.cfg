\* Witness: A repair or a scrub writes the vote's version to the replica that was lost.
\* TLC must report Witness_ARepairFillsAMissingReplica violated, which shows it is reachable.
CONSTANTS
    NPtr = 3
    NBlob = 2
    Versions = {"A", "B", "C"}
    Initial = "A"
    MaxWrites = 2
    MaxCrashes = 1
    SyncBeforeCollect = TRUE
    Fix = "record"
    RecordDetail = TRUE
    LoggedWrites = TRUE
    Maintenance = TRUE
    Control = "none"
SPECIFICATION Spec
INVARIANTS
    Witness_ARepairFillsAMissingReplica
CHECK_DEADLOCK FALSE
