\* Witness: a recovery finishes the swaps, the end record and the sweep after an earlier recoverer died between its swaps.
\* TLC must report Witness_ARecoveryIsResumedAfterADeathBetweenItsSwaps violated, which shows it is reachable.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 2
    MaxDeaths = 1
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    Cyclic = FALSE
    CycleMod = 0
    UpSteps = 0
    Scenario = "Plain2"
    Control = "none"
SPECIFICATION Spec
PROPERTIES
    Witness_ARecoveryIsResumedAfterADeathBetweenItsSwaps
CHECK_DEADLOCK FALSE
