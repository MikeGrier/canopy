\* Copyright (c) Michael Grier.
\* Negative control: recovery publishes the trusted count before it has made the swaps,
\* after a host crash that left a prepared transaction. TLC must report
\* TrustIsRestoredOnlyByAFinishedRecovery violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 2
    MaxDeaths = 0
    MaxCrashes = 1
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Scenario = "Plain2"
    Control = "count-published-before-the-namespace-is-whole"
SPECIFICATION Spec
PROPERTIES
    TrustIsRestoredOnlyByAFinishedRecovery
CHECK_DEADLOCK FALSE
