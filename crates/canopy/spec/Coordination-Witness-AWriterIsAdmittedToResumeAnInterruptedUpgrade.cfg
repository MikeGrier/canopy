\* Witness: a handle that may write and speaks the upgrade target is admitted while an upgrade is recorded in progress and its upgrader has died.
\* TLC must report Witness_AWriterIsAdmittedToResumeAnInterruptedUpgrade violated, which shows it is reachable.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 0
    MaxDeaths = 1
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    Cyclic = FALSE
    CycleMod = 0
    UpSteps = 0
    Scenario = "SafeAndTargetWriter"
    Control = "none"
SPECIFICATION Spec
PROPERTIES
    Witness_AWriterIsAdmittedToResumeAnInterruptedUpgrade
CHECK_DEADLOCK FALSE
