\* Negative control: a conversion cancelled after the drain leaves the handle
\* usable although it holds nothing. TLC must report
\* ACancelledOrFailedConversionLeavesTheHandleDetached violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 0
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "SafeAndReader"
    Control = "cancelled-conversion-stays-usable"
SPECIFICATION Spec
PROPERTIES
    ACancelledOrFailedConversionLeavesTheHandleDetached
CHECK_DEADLOCK FALSE
