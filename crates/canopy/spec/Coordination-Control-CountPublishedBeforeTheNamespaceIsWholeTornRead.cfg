\* Negative control: recovery publishes the even count before it has made the swaps, and a
\* recoverer that stops between its swaps lets a read sample the same even count on both
\* sides of a half-applied namespace. TLC must report
\* SettledReadSawNoPartOfAnOperation violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 1
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 1
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Scenario = "Plain2"
    Control = "count-published-before-the-namespace-is-whole"
SPECIFICATION Spec
PROPERTIES
    SettledReadSawNoPartOfAnOperation
CHECK_DEADLOCK FALSE
