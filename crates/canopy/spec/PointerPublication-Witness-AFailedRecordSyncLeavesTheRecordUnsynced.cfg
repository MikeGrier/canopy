\* Witness: A write's fsync of its record fails, and the record is in the file and not durable.
\* TLC must report Witness_AFailedRecordSyncLeavesTheRecordUnsynced violated, which shows it is reachable.
CONSTANTS
    NPtr = 3
    NBlob = 2
    Versions = {"A", "B", "C"}
    Initial = "A"
    MaxWrites = 2
    MaxCrashes = 1
    SyncBeforeCollect = TRUE
    Fix = "record"
    RecordDetail = TRUE
    LoggedWrites = FALSE
    Maintenance = FALSE
    Control = "none"
SPECIFICATION Spec
INVARIANTS
    Witness_AFailedRecordSyncLeavesTheRecordUnsynced
CHECK_DEADLOCK FALSE
