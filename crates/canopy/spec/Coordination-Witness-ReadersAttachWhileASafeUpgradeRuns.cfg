\* Witness: a handle that may only read is attached while an upgrade that is safe for readers runs.
\* TLC must report Witness_ReadersAttachWhileASafeUpgradeRuns violated, which shows it is reachable.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 0
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    Cyclic = FALSE
    CycleMod = 0
    UpSteps = 0
    Scenario = "SafeAndReader"
    Control = "none"
SPECIFICATION Spec
INVARIANTS
    Witness_ReadersAttachWhileASafeUpgradeRuns
CHECK_DEADLOCK FALSE
