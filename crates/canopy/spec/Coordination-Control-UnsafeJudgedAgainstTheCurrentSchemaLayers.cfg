\* Copyright (c) Michael Grier.
\* Negative control: the upgrade of the second of two layers is judged safe for readers against
\* the current schema and not against the oldest, so a reader of the oldest schema of that
\* layer stays attached over data it cannot read. TLC must report
\* AnAttachedHandleCanReadTheData violated.
CONSTANTS
    Procs = {1, 2, 3}
    MaxRequests = 0
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    Cyclic = FALSE
    CycleMod = 0
    UpSteps = 0
    Scenario = "TwoLayerUpgradesFloor"
    Control = "unsafe-judged-against-the-current-schema"
SPECIFICATION Spec
INVARIANTS
    AnAttachedHandleCanReadTheData
CHECK_DEADLOCK FALSE
