\* Under the contract's fairness a handle that waits to attach is admitted beside an
\* upgrader, a writer and a reader: every invariant and property holds.
CONSTANTS
    Scenario = "UnsafeWriterReader"
    MaxUpgrades = 1
    ExclusiveFirst = FALSE
    CountUpgrades = TRUE
    Escapes = FALSE
    Refusals = FALSE
    Deaths = FALSE
SPECIFICATION ContractSpec
INVARIANTS
    TypeOK
    OneWriterAtATime
    GateIsExclusive
    TiersAreExclusive
PROPERTIES
    AnAttachingHandleIsServed
CHECK_DEADLOCK TRUE
