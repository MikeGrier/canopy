\* Negative control: A settle rolls the pointer replicas forward from a record that is in the file and not yet durable, and a crash loses the record.
\* TLC must report IdleImpliesSettled violated.
CONSTANTS
    NPtr = 3
    NBlob = 2
    Versions = {"A", "B", "C"}
    Initial = "A"
    MaxWrites = 2
    MaxCrashes = 1
    SyncBeforeCollect = TRUE
    Fix = "record"
    RecordDetail = TRUE
    LoggedWrites = FALSE
    Maintenance = FALSE
    Control = "settle-without-sync"
SPECIFICATION Spec
INVARIANTS
    IdleImpliesSettled
CHECK_DEADLOCK FALSE
