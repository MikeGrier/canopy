\* Negative control: an upgrade that is unsafe for readers does not take the reader tier
\* exclusively, so a reader stays attached over data it cannot read. TLC must report
\* AnAttachedHandleCanReadTheData violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 0
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Scenario = "UnsafeAndReader"
    Control = "unsafe-upgrade-leaves-readers"
SPECIFICATION Spec
INVARIANTS
    AnAttachedHandleCanReadTheData
CHECK_DEADLOCK FALSE
