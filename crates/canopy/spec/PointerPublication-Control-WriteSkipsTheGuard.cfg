\* Negative control: A write does not run the record guard.
\* TLC must report IdleImpliesSettled violated.
CONSTANTS
    NPtr = 3
    NBlob = 2
    Versions = {"A", "B", "C"}
    Initial = "A"
    MaxWrites = 2
    MaxCrashes = 1
    SyncBeforeCollect = TRUE
    Fix = "record"
    RecordDetail = TRUE
    LoggedWrites = FALSE
    Maintenance = FALSE
    Control = "write-skips-the-guard"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    IdleImpliesSettled
CHECK_DEADLOCK FALSE
