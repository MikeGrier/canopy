CONSTANTS
    Procs = {1, 2}
    MaxRequests = 2
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = FALSE
    Txn = FALSE
    UnloggedRecovery = TRUE
    MixedWrites = FALSE
    Cyclic = TRUE
    CycleMod = 4
    UpSteps = 0
    Scenario = "TwoSafe"
    Control = "upgrader-keeps-tiers"
SPECIFICATION Spec
CHECK_DEADLOCK TRUE
