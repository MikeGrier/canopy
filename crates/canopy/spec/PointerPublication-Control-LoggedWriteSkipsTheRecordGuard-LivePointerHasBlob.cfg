\* Negative control: A transaction's write of the document does not run the record guard.
\* TLC must report LivePointerHasBlob violated.
CONSTANTS
    NPtr = 3
    NBlob = 2
    Versions = {"A", "B", "C"}
    Initial = "A"
    MaxWrites = 2
    MaxCrashes = 1
    SyncBeforeCollect = TRUE
    Fix = "record"
    RecordDetail = TRUE
    LoggedWrites = TRUE
    Maintenance = FALSE
    Control = "logged-write-skips-the-guard"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    LivePointerHasBlob
CHECK_DEADLOCK FALSE
