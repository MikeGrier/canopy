\* Negative control: an upgrader keeps its shared tiers while it waits for the
\* gate exclusively, so two upgraders each wait for a tier the other holds.
\* TLC must report a deadlock.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 0
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = FALSE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Scenario = "TwoSafe"
    Control = "upgrader-keeps-tiers"
SPECIFICATION Spec
INVARIANTS
    TypeOK
CHECK_DEADLOCK TRUE
