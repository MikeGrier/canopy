\* Negative control: STRANDED-VOTE with no guard selected. The protocol strands the
\* vote, so TLC must report IdleImpliesSettled violated.
CONSTANTS
    NPtr = 3
    NBlob = 2
    Versions = {"A", "B", "C"}
    Initial = "A"
    MaxWrites = 2
    MaxCrashes = 1
    SyncBeforeCollect = TRUE
    Fix = "none"
    RecordDetail = FALSE
    LoggedWrites = FALSE
    Maintenance = FALSE
    Control = "none"
SPECIFICATION Spec
INVARIANTS
    IdleImpliesSettled
CHECK_DEADLOCK FALSE
