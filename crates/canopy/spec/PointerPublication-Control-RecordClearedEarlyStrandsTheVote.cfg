\* Negative control: The record is cleared before the pointer replicas are renamed, and a crash leaves them without it.
\* TLC must report IdleImpliesSettled violated.
CONSTANTS
    NPtr = 3
    NBlob = 2
    Versions = {"A", "B", "C"}
    Initial = "A"
    MaxWrites = 2
    MaxCrashes = 1
    SyncBeforeCollect = TRUE
    Fix = "record"
    RecordDetail = TRUE
    LoggedWrites = FALSE
    Maintenance = FALSE
    Control = "record-cleared-early"
SPECIFICATION Spec
INVARIANTS
    IdleImpliesSettled
CHECK_DEADLOCK FALSE
