\* Witness: an upgrader holds its tiers and finds the layer already moved by another upgrade, so it gives up.
\* TLC must report Witness_AnUpgraderGivesUpAtTheRecheck violated, which shows it is reachable.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 0
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    Cyclic = FALSE
    CycleMod = 0
    UpSteps = 0
    Scenario = "TwoSafe"
    Control = "none"
SPECIFICATION Spec
PROPERTIES
    Witness_AnUpgraderGivesUpAtTheRecheck
CHECK_DEADLOCK FALSE
