\* Negative control: an upgrade with a body is judged safe for readers against the current
\* schema and not against the oldest one the store admits. TLC must report
\* AnUpgradeIsJudgedAgainstTheOldestSchema violated.
CONSTANTS
    Procs = {1, 2, 3}
    MaxRequests = 0
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 2
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 1
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "ChainFloor"
    Control = "unsafe-judged-against-the-current-schema"
SPECIFICATION Spec
PROPERTIES
    AnUpgradeIsJudgedAgainstTheOldestSchema
CHECK_DEADLOCK FALSE
