\* Witness: A recovery rolls a prepared transaction forward.
\* TLC must report Witness_APreparedTransactionIsRolledForward violated, which shows it is reachable.
CONSTANTS
    NPtr = 3
    NBlob = 2
    Versions = {"A", "B", "C"}
    Initial = "A"
    MaxWrites = 2
    MaxCrashes = 1
    SyncBeforeCollect = TRUE
    Fix = "record"
    RecordDetail = TRUE
    LoggedWrites = TRUE
    Maintenance = FALSE
    Control = "none"
SPECIFICATION Spec
INVARIANTS
    Witness_APreparedTransactionIsRolledForward
CHECK_DEADLOCK FALSE
