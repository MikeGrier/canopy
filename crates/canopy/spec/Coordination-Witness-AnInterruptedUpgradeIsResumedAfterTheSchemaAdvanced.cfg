\* Witness: a recoverer resumes an upgrade whose schema has advanced and whose intent still stands.
\* TLC must report Witness_AnInterruptedUpgradeIsResumedAfterTheSchemaAdvanced violated, which shows it is reachable.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 2
    MaxDeaths = 1
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 1
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 2
    Callbacks = FALSE
    Scenario = "SafeAndTargetWriter"
    Control = "none"
SPECIFICATION Spec
PROPERTIES
    Witness_AnInterruptedUpgradeIsResumedAfterTheSchemaAdvanced
CHECK_DEADLOCK FALSE
