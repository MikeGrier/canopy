    Procs = {1, 2}
    MaxRequests = 1
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 1
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
