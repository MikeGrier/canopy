\* Witness: discovery runs while an upgrader is in its body and reports recovery as not required.
\* TLC must report Witness_DiscoveryMeetsALiveUpgradersBody violated, which shows it is reachable.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 0
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 1
    MaxUpgrades = 1
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 2
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "SafeAndReader"
    Control = "none"
SPECIFICATION Spec
PROPERTIES
    Witness_DiscoveryMeetsALiveUpgradersBody
CHECK_DEADLOCK FALSE
