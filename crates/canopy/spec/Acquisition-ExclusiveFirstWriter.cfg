\* With shared admission withheld while an upgrader waits, an upgrader beside a writer and
\* a reader is served under the contract's fairness: every invariant and property holds.
CONSTANTS
    Scenario = "UnsafeWriterReader"
    MaxUpgrades = 1
    ExclusiveFirst = TRUE
    CountUpgrades = TRUE
    Escapes = FALSE
    Refusals = FALSE
    Deaths = FALSE
SPECIFICATION ContractSpec
INVARIANTS
    TypeOK
    OneWriterAtATime
    GateIsExclusive
    TiersAreExclusive
PROPERTIES
    AWaitingUpgraderIsServed
    StoreMakesProgress
CHECK_DEADLOCK TRUE
