\* Under the contract's fairness, with an upgrader safe for readers and a writer, which the
\* reopened gate lets wait for the writer tier during the upgrade, the store makes progress:
\* every invariant and property holds.
CONSTANTS
    Scenario = "SafeAndWriter"
    MaxUpgrades = 1
    ExclusiveFirst = FALSE
SPECIFICATION ContractSpec
INVARIANTS
    TypeOK
    OneWriterAtATime
    GateIsExclusive
    TiersAreExclusive
PROPERTIES
    StoreMakesProgress
    AnUpgradeHoldingItsTiersCompletes
CHECK_DEADLOCK TRUE
