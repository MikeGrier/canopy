\* Under the contract's fairness an upgrader can be passed over forever by a handle that
\* takes the gate shared each time it frees. TLC must report AWaitingUpgraderIsServed violated.
CONSTANTS
    Scenario = "UnsafeAndReader"
    MaxUpgrades = 1
    ExclusiveFirst = FALSE
    CountUpgrades = TRUE
    Escapes = FALSE
    Refusals = FALSE
    Deaths = FALSE
SPECIFICATION ContractSpec
INVARIANTS
    TypeOK
    OneWriterAtATime
    GateIsExclusive
    TiersAreExclusive
PROPERTIES
    AWaitingUpgraderIsServed
CHECK_DEADLOCK TRUE
