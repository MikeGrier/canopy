\* Negative control: A resumer that waited for the exclusion does not read the root again, and creates over a store whose creation has finished.
\* TLC must report NoCreationAfterTheMarker violated.
CONSTANTS
    Procs = {1, 2}
    NArt = 2
    MaxDeaths = 0
    MaxCrashes = 0
    Intrusion = FALSE
    Scenario = "TwoCreators"
    Control = "resume-without-reread"
SPECIFICATION Spec
INVARIANTS
    NoCreationAfterTheMarker
CHECK_DEADLOCK FALSE
