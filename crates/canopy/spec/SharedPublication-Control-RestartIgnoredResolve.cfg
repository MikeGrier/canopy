    MaxRequests = 2
    MaxDeaths = 1
    MaxCrashes = 1
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = FALSE
    Txn = FALSE
    UnloggedRecovery = TRUE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
