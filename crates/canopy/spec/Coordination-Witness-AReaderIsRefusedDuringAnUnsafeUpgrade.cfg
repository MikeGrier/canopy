\* Witness: a handle that may only read is refused while an upgrade unsafe for readers is recorded in progress, which only an upgrader that died in its body leaves behind.
\* TLC must report Witness_AReaderIsRefusedDuringAnUnsafeUpgrade violated, which shows it is reachable.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 0
    MaxDeaths = 1
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    Cyclic = FALSE
    CycleMod = 0
    UpSteps = 0
    Scenario = "UnsafeAndReader"
    Control = "none"
SPECIFICATION Spec
PROPERTIES
    Witness_AReaderIsRefusedDuringAnUnsafeUpgrade
CHECK_DEADLOCK FALSE
