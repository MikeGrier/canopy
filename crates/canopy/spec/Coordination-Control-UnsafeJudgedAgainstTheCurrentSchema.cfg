\* Negative control: an upgrade is judged safe for readers against the current schema and
\* not against the oldest one the store admits. TLC must report
\* AnUpgradeIsJudgedAgainstTheOldestSchema violated.
CONSTANTS
    Procs = {1, 2, 3}
    MaxRequests = 0
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    Cyclic = FALSE
    CycleMod = 0
    UpSteps = 0
    Scenario = "ChainFloor"
    Control = "unsafe-judged-against-the-current-schema"
SPECIFICATION Spec
PROPERTIES
    AnUpgradeIsJudgedAgainstTheOldestSchema
CHECK_DEADLOCK FALSE
