\* Negative control: state that cannot be vouched for after a host crash is
\* read as it is stored, and a crash can roll the count back over a writer
\* that was mid-operation. TLC must report
\* SettledReadSawNoPartOfAnOperation violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 2
    MaxDeaths = 0
    MaxCrashes = 1
    MaxReads = 1
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "Plain2"
    Control = "read-untrusted-as-stored"
SPECIFICATION Spec
PROPERTIES
    SettledReadSawNoPartOfAnOperation
CHECK_DEADLOCK FALSE
