\* Copyright (c) Michael Grier.
\* Negative control: a listing says it may be incomplete only when it found no
\* free entry, so a handle that attached without an entry while the registry was
\* full goes unmentioned once an entry frees up. TLC must report
\* AListingSaysWhenItMayBeIncomplete violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 0
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 1
    MaxListings = 1
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Scenario = "Plain2"
    Control = "listing-infers-from-fullness"
SPECIFICATION Spec
PROPERTIES
    AListingSaysWhenItMayBeIncomplete
CHECK_DEADLOCK FALSE
