    MaxRequests = 1
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 1
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    Cyclic = FALSE
    CycleMod = 0
    UpSteps = 2
    Scenario = "SafeAndTargetWriter"
    Control = "none"
SPECIFICATION Spec
PROPERTIES
    Witness_TheIntentIsRecorded
CHECK_DEADLOCK FALSE
