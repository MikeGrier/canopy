\* Witness: a read ends over a store left half applied by a transaction that failed part-way, with the fence set, which is the snapshot taken after such a failure.
\* TLC must report Witness_AReadAfterAnUnresolvedFailureIsRejected violated, which shows it is reachable.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 1
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 1
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    Cyclic = FALSE
    CycleMod = 0
    UpSteps = 0
    Scenario = "Plain2"
    Control = "none"
SPECIFICATION Spec
PROPERTIES
    Witness_AReadAfterAnUnresolvedFailureIsRejected
CHECK_DEADLOCK FALSE
