\* Witness: A write begins with a stale durable record and writes its own, when the settle looks only at the file.
\* TLC must report Witness_AWriteFollowsAFailedClear violated, which shows it is reachable.
CONSTANTS
    NPtr = 3
    NBlob = 2
    Versions = {"A", "B", "C"}
    Initial = "A"
    MaxWrites = 2
    MaxCrashes = 1
    SyncBeforeCollect = TRUE
    Fix = "record"
    RecordDetail = TRUE
    LoggedWrites = FALSE
    Maintenance = FALSE
    Control = "settle-looks-only-at-the-file"
SPECIFICATION Spec
INVARIANTS
    Witness_AWriteFollowsAFailedClear
CHECK_DEADLOCK FALSE
