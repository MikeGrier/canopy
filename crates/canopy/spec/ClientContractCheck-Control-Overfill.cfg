\* Negative control: submission is accepted without a completion slot.
CONSTANTS
    Pairs = {1, 2}
    Commands = {"read", "write"}
    Results = {"ok", "contended"}
    Values = {"initial", "changed"}
    InitialValue = "initial"
    CompletionCapacity = 1
    MaxSubmissions = 3
    Control = "overfill"
SPECIFICATION CheckSpec
INVARIANTS
    CompletionCapacityReserved
CHECK_DEADLOCK FALSE
