\* Negative control: the prepare record is written before ingest has staged the
\* bodies, so recovery would roll forward to bodies that are not there. TLC must
\* report ABodyIsStagedBeforeItIsPrepared violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 1
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "Plain2"
    Control = "prepare-before-ingest"
SPECIFICATION Spec
INVARIANTS
    ABodyIsStagedBeforeItIsPrepared
CHECK_DEADLOCK FALSE
