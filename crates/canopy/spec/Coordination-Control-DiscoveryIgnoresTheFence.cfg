\* Copyright (c) Michael Grier.
\* Negative control: discovery does not read the fence, so a store whose holder failed
\* unresolved and let go is reported as needing nothing. TLC must report
\* DiscoveryReportsAbandonedWorkWhenNobodyHoldsExclusion violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 1
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 1
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Scenario = "Plain2"
    Control = "discovery-ignores-the-fence"
SPECIFICATION Spec
PROPERTIES
    DiscoveryReportsAbandonedWorkWhenNobodyHoldsExclusion
CHECK_DEADLOCK FALSE
