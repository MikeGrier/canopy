\* Copyright (c) Michael Grier.
\* Negative control: an upgrade is judged safe for readers against the current schema and
\* not against the oldest one the store admits, so a reader of an older schema stays attached
\* over data it cannot read. TLC must report AnAttachedHandleCanReadTheData violated.
CONSTANTS
    Procs = {1, 2, 3}
    MaxRequests = 0
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Scenario = "ChainFloor"
    Control = "unsafe-judged-against-the-current-schema"
SPECIFICATION Spec
INVARIANTS
    AnAttachedHandleCanReadTheData
CHECK_DEADLOCK FALSE
