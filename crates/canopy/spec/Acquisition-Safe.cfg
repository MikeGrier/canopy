\* Under the contract's fairness, with an upgrader safe for readers and a reader, the store
\* makes progress and the upgrade completes: every invariant and property holds.
CONSTANTS
    Scenario = "SafeAndReader"
    MaxUpgrades = 1
    ExclusiveFirst = FALSE
    CountUpgrades = TRUE
    Escapes = FALSE
    Refusals = FALSE
    Deaths = FALSE
SPECIFICATION ContractSpec
INVARIANTS
    TypeOK
    OneWriterAtATime
    GateIsExclusive
    TiersAreExclusive
PROPERTIES
    StoreMakesProgress
    AnUpgradeHoldingItsTiersCompletes
CHECK_DEADLOCK TRUE
