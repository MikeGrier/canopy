\* Witness: a recoverer dies after its sweep and before it publishes the count, and the next acquirer is told recovery is required.
\* TLC must report Witness_ARecovererDiesAfterTheSweep violated, which shows it is reachable.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 2
    MaxDeaths = 1
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "Plain2"
    Control = "none"
SPECIFICATION Spec
INVARIANTS
    Witness_ARecovererDiesAfterTheSweep
CHECK_DEADLOCK FALSE
