\* Negative control: a listing inspects an entry without claiming it, so it can read
\* the token of a handle that died beside the liveness lock of the handle that has
\* since taken the entry, and report the dead handle live. TLC must report
\* LiveReportIsJustified violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 0
    MaxDeaths = 1
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 1
    MaxListings = 1
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "Plain2"
    Control = "list-without-claim"
SPECIFICATION Spec
PROPERTIES
    LiveReportIsJustified
CHECK_DEADLOCK FALSE
