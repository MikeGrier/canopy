\* Negative control: a draining upgrader's notification is lost, so it sleeps on after its
\* clone's operation has ended. TLC must report ADrainEnds violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 0
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 1
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Notifications = TRUE
    Scenario = "SafeAndReader"
    Control = "notification-lost"
SPECIFICATION HoldSpec
PROPERTIES
    ADrainEnds
CHECK_DEADLOCK FALSE
