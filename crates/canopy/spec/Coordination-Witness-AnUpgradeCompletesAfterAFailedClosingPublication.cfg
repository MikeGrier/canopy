\* Witness: an upgrade completes and the closing publication of the count fails, leaving the fence set.
\* TLC must report Witness_AnUpgradeCompletesAfterAFailedClosingPublication violated, which shows it is reachable.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 1
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 1
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 2
    Callbacks = FALSE
    Scenario = "SafeAndTargetWriter"
    Control = "none"
SPECIFICATION Spec
PROPERTIES
    Witness_AnUpgradeCompletesAfterAFailedClosingPublication
CHECK_DEADLOCK FALSE
