\* The "record" guard with unlogged writes to three documents by two writers, one of
\* which may die and the host may crash: every invariant and property holds.
\* Tier: milestone.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 2
    MaxDeaths = 1
    MaxCrashes = 1
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = FALSE
    Txn = FALSE
    UnloggedRecovery = TRUE
    MixedWrites = FALSE
    Cyclic = FALSE
    CycleMod = 0
    UpSteps = 0
    Scenario = "Plain2"
    Control = "none"
    Docs = {1, 2, 3}
    NPtr = 3
    NBlob = 1
    Fix = "record"
    PubControl = "none"
SPECIFICATION SpSpec
INVARIANTS
    SpTypeOK
    DurablePointerHasBlob
    LivePointerHasBlob
    EveryDocumentHasAMajority
    OutcomeIsFixedOnceRecovered
    AHealthyHolderFindsEveryDocumentSettled
PROPERTIES
    OnlyAHolderChangesADocument
CHECK_DEADLOCK FALSE
