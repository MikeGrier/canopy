\* Negative control: The consumer checks for work before it clears the record.
\* A wake is lost, so TLC must report AWaiterIsWoken violated.
CONSTANTS
    Producers = {1, 2}
    MaxPublish = 2
    Control = "check-before-clear"
SPECIFICATION FairSpec
INVARIANTS
    TypeOK
PROPERTIES
    AWaiterIsWoken
CHECK_DEADLOCK FALSE
