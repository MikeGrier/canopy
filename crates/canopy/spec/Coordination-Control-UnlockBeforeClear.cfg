\* Negative control: a clean release drops the lock and then clears the
\* record, so another acquirer can find a record whose holder is alive. TLC
\* must report NoFalseAbandonmentReport violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 3
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Scenario = "Plain2"
    Control = "unlock-before-clear"
SPECIFICATION Spec
PROPERTIES
    NoFalseAbandonmentReport
CHECK_DEADLOCK FALSE
