\* Negative control: an upgrader begins while it holds writer exclusion, so it
\* waits for the writer tier against an attached writer that waits for the
\* exclusion the upgrader holds. TLC must report a deadlock.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 2
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = FALSE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    Cyclic = FALSE
    CycleMod = 0
    UpSteps = 0
    Scenario = "SafeAndWriter"
    Control = "upgrader-holds-exclusion"
SPECIFICATION Spec
INVARIANTS
    TypeOK
CHECK_DEADLOCK TRUE
