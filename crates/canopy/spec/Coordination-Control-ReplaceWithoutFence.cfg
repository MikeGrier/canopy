\* Negative control: an acquirer that finds an abandoned record replaces it
\* without setting the fence. TLC must report
\* AbandonedRecordNeverReplacedUnfenced violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 3
    MaxDeaths = 1
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    Cyclic = FALSE
    CycleMod = 0
    UpSteps = 0
    Scenario = "Plain2"
    Control = "replace-without-fence"
SPECIFICATION Spec
PROPERTIES
    AbandonedRecordNeverReplacedUnfenced
CHECK_DEADLOCK FALSE
