\* Negative control: a writer that speaks only the source schema is admitted while an upgrade
\* is interrupted, and resumes it. TLC must report
\* AResumptionIsMadeOnlyByAHandleThatSpeaksTheTarget violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 2
    MaxDeaths = 1
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 1
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    Cyclic = FALSE
    CycleMod = 0
    UpSteps = 2
    Scenario = "SafeAndWriter"
    Control = "interrupted-upgrade-admits-source-writers"
SPECIFICATION Spec
PROPERTIES
    AResumptionIsMadeOnlyByAHandleThatSpeaksTheTarget
CHECK_DEADLOCK FALSE
