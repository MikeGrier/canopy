\* Negative control: a handle takes an entry whose claim lock it holds without
\* trying the liveness lock, and overwrites the token of a live handle. TLC must
\* report AFreeClaimShowsTheTokenOfTheLivenessHolder violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 0
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 1
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "Plain2"
    Control = "reuse-without-liveness-probe"
SPECIFICATION Spec
INVARIANTS
    AFreeClaimShowsTheTokenOfTheLivenessHolder
CHECK_DEADLOCK FALSE
