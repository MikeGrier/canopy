\* Witness: an upgrader holds the gate and waits for the writer tier while a handle that may write is attached.
\* TLC must report Witness_AnUpgraderWaitsForAttachedWriters violated, which shows it is reachable.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 0
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "SafeAndWriter"
    Control = "none"
SPECIFICATION Spec
INVARIANTS
    Witness_AnUpgraderWaitsForAttachedWriters
CHECK_DEADLOCK FALSE
