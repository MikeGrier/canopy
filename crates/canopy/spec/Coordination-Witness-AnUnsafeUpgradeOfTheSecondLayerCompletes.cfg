\* Witness: an upgrade of the second layer that is unsafe for readers completes and raises the oldest reader schema of that layer.
\* TLC must report Witness_AnUnsafeUpgradeOfTheSecondLayerCompletes violated, which shows it is reachable.
CONSTANTS
    Procs = {1, 2, 3}
    MaxRequests = 0
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "TwoLayerUpgradesUnsafe"
    Control = "none"
SPECIFICATION Spec
PROPERTIES
    Witness_AnUnsafeUpgradeOfTheSecondLayerCompletes
CHECK_DEADLOCK FALSE
