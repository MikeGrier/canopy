\* Negative control: With no guard, recovery does nothing for the documents, and a write that fails part-way over one that did leaves no majority.
\* TLC must report EveryDocumentHasAMajority violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 18
    MaxWrites = 2
    RecoverySchedule = "all"
    InitialDirectoryDebt = 0
    MaxTerminations = 1
    MaxCrashes = 1
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = FALSE
    Txn = FALSE
    UnloggedRecovery = TRUE
    MixedWrites = FALSE
    PublicationsFail = TRUE
    CrashFences = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "Plain2"
    Control = "none"
    Docs = {1, 2}
    NPtr = 3
    NBlob = 1
    Fix = "none"
    PubControl = "none"
SPECIFICATION QuotientSpec
CONSTRAINT WritesBounded
VIEW QuotientView
INVARIANTS
    QuotientTypeOK
    EveryDocumentHasAMajority
    OnlyOrdinaryRequestsConsumeTheBudget
CHECK_DEADLOCK FALSE
