\* Witness: an upgrader dies holding exclusion before it records the intent.
\* TLC must report Witness_AnUpgraderTerminatesBeforeTheIntent violated, which shows it is reachable.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 1
    MaxTerminations = 1
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 1
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    PublicationsFail = TRUE
    CrashFences = FALSE
    UpSteps = 2
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "SafeAndTargetWriter"
    Control = "none"
SPECIFICATION Spec
PROPERTIES
    Witness_AnUpgraderTerminatesBeforeTheIntent
CHECK_DEADLOCK FALSE
