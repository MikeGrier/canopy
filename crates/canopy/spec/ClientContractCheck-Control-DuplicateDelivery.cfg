\* TLC must report AtMostOneDelivery violated.
\* Negative control: a delivered completion is delivered a second time.
CONSTANTS
    Pairs = {1, 2}
    Commands = {"read", "write"}
    Results = {"ok", "contended"}
    Values = {"initial", "changed"}
    InitialValue = "initial"
    CompletionCapacity = 1
    MaxSubmissions = 3
    Control = "duplicate-delivery"
SPECIFICATION CheckSpec
INVARIANTS
    AtMostOneDelivery
CHECK_DEADLOCK FALSE
