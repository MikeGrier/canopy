\* With upgrade starts not counted, a handle waiting to attach can be passed over forever by an
\* upgrader that attaches, upgrades and attaches again, so that the gate is held exclusively
\* again and again and the handle's take is grantable only between those holds. TLC must
\* report AnAttachingHandleIsServed violated.
CONSTANTS
    Scenario = "UnsafeWriterReader"
    MaxUpgrades = 1
    ExclusiveFirst = FALSE
    CountUpgrades = FALSE
    Escapes = FALSE
    Refusals = FALSE
    Deaths = FALSE
SPECIFICATION ContractSpec
INVARIANTS
    TypeOK
    OneWriterAtATime
    GateIsExclusive
    TiersAreExclusive
PROPERTIES
    AnAttachingHandleIsServed
CHECK_DEADLOCK TRUE
