\* Negative control: recovery clears the fence when it starts, so a recoverer that stops
\* leaves an unresolved transaction that nothing marks. TLC must report
\* UnresolvedWorkIsNeverInvisible violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 1
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Scenario = "Plain2"
    Control = "fence-cleared-at-recovery-start"
SPECIFICATION Spec
INVARIANTS
    UnresolvedWorkIsNeverInvisible
CHECK_DEADLOCK FALSE
