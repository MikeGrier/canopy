\* Negative control: the schema of the layer advances after the first migration step, so
\* handles are admitted against a layer that is only partly migrated. TLC must report
\* TheVersionAdvancesOnlyAfterEveryStep violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 1
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 1
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 2
    Callbacks = FALSE
    Scenario = "SafeAndTargetWriter"
    Control = "version-advanced-early"
SPECIFICATION Spec
PROPERTIES
    TheVersionAdvancesOnlyAfterEveryStep
CHECK_DEADLOCK FALSE
