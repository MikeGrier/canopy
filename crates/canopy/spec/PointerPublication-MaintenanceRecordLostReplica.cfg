\* The "record" guard with a lost pointer replica: a write that fails part-way publishing to a
\* document that has lost one replica leaves three values, because only a repair
\* restores a replica under this guard. TLC must report IdleImpliesSettled violated.
CONSTANTS
    NPtr = 3
    NBlob = 2
    Versions = {"A", "B", "C"}
    Initial = "A"
    MaxWrites = 2
    MaxCrashes = 1
    SyncBeforeCollect = TRUE
    Fix = "record"
    RecordDetail = TRUE
    LoggedWrites = TRUE
    Maintenance = TRUE
    Control = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    IdleImpliesSettled
CHECK_DEADLOCK FALSE
