\* Negative control: the commit log is reset while a transaction is in flight, so a
\* prepared transaction is discarded that only the log lets recovery finish. TLC
\* must report AResetNeverDiscardsAPreparedTransaction violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 1
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    Cyclic = FALSE
    CycleMod = 0
    UpSteps = 0
    Scenario = "Plain2"
    Control = "reset-during-a-transaction"
SPECIFICATION Spec
PROPERTIES
    AResetNeverDiscardsAPreparedTransaction
CHECK_DEADLOCK FALSE
