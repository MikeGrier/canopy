CONSTANTS
    Procs = {1, 2}
    MaxRequests = 27
    MaxWrites = 3
    RecoverySchedule = "stale-completion"
    InitialDirectoryDebt = 0
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = FALSE
    Txn = FALSE
    UnloggedRecovery = TRUE
    MixedWrites = FALSE
    PublicationsFail = TRUE
    CrashFences = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "Plain2"
    Control = "none"
    Docs = {1}
    NPtr = 3
    NBlob = 1
    Fix = "record"
    PubControl = "none"
SPECIFICATION QuotientSpec
CONSTRAINT WritesBounded
VIEW QuotientView
INVARIANTS
    QuotientTypeOK
    DurablePointerHasBlob
    LivePointerHasBlob
    EveryDocumentHasAMajority
    OutcomeIsFixedOnceRecovered
    AHealthyHolderFindsEveryDocumentSettled
    DocumentWorkUsesCurrentGeneration
    SavedRecoveryCountNeverLeads
    StoredVersionsNeverLeadTheGeneration
    OnlyOrdinaryRequestsConsumeTheBudget
PROPERTIES
    OnlyAHolderChangesADocument
CHECK_DEADLOCK FALSE
