\* Witness: an upgrade is recorded as unsafe for readers although its floor is at or below the current schema, because the oldest schema the store admits is below the floor.
\* TLC must report Witness_AnUpgradeIsUnsafeAgainstTheOldestAndSafeAgainstTheCurrent violated, which shows it is reachable.
CONSTANTS
    Procs = {1, 2, 3}
    MaxRequests = 0
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = FALSE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    Cyclic = FALSE
    CycleMod = 0
    UpSteps = 0
    Scenario = "ChainFloor"
    Control = "none"
SPECIFICATION Spec
PROPERTIES
    Witness_AnUpgradeIsUnsafeAgainstTheOldestAndSafeAgainstTheCurrent
CHECK_DEADLOCK FALSE
