\* Witness: A transaction writes the document with a stale durable record, when the settle looks only at the file.
\* TLC must report Witness_ALoggedWriteFollowsAFailedClear violated, which shows it is reachable.
CONSTANTS
    NPtr = 3
    NBlob = 2
    Versions = {"A", "B", "C"}
    Initial = "A"
    MaxWrites = 2
    MaxCrashes = 1
    SyncBeforeCollect = TRUE
    Fix = "record"
    RecordDetail = TRUE
    LoggedWrites = TRUE
    Maintenance = FALSE
    Control = "settle-looks-only-at-the-file"
SPECIFICATION Spec
INVARIANTS
    Witness_ALoggedWriteFollowsAFailedClear
CHECK_DEADLOCK FALSE
