\* Negative control: a process need never take its own steps, so what it holds it can hold
\* forever. TLC must report ADrivenRecoveryCompletes violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 2
    MaxDeaths = 0
    MaxCrashes = 0
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 0
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "Plain2"
    Control = "none"
SPECIFICATION HoldSpecWithoutOwnSteps
PROPERTIES
    ADrivenRecoveryCompletes
CHECK_DEADLOCK FALSE
