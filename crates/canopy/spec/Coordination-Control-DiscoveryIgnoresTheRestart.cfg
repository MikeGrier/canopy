\* Copyright (c) Michael Grier.
\* Negative control: discovery does not read the restart state, so after a host crash that
\* lost the record and the fence it reports a store that cannot be vouched for as needing
\* nothing. TLC must report DiscoveryReportsAbandonedWorkWhenNobodyHoldsExclusion violated.
CONSTANTS
    Procs = {1, 2}
    MaxRequests = 0
    MaxDeaths = 0
    MaxCrashes = 1
    MaxReads = 0
    MaxLeases = 0
    NSlots = 0
    MaxListings = 0
    MaxDiscoveries = 1
    MaxUpgrades = 0
    Escapes = TRUE
    Txn = TRUE
    UnloggedRecovery = FALSE
    MixedWrites = FALSE
    UpSteps = 0
    Callbacks = FALSE
    Notifications = FALSE
    Scenario = "Plain2"
    Control = "discovery-ignores-the-restart"
SPECIFICATION Spec
PROPERTIES
    DiscoveryReportsAbandonedWorkWhenNobodyHoldsExclusion
CHECK_DEADLOCK FALSE
