[package]
name = "acadia"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
documentation = "https://docs.rs/acadia"
description = "The filesystem seam under canopy -- a specified Vfs contract with OS, in-memory, and fault-injecting backends -- and the coordination layer above it."
exclude = ["DESIGN-NOTES.md"]

[dependencies]
cap-std = "4.0"
cap-fs-ext = "4.0"

[dev-dependencies]
test-timers = { path = "../test-timers" }

# `LoomSignal`, a signal loom can run inside its model, exists only under `--cfg canopy_loom`.
[target.'cfg(canopy_loom)'.dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(canopy_loom)"] }

# For the `flock` and open-file-description locks behind `OsFs::lock_exclusive` and
# `OsFs::try_lock`; std exposes no advisory-lock call.
[target.'cfg(unix)'.dependencies]
libc = "0.2.176"

# For `LockFileEx`/`UnlockFileEx` behind `OsFs::try_lock`; `lock_exclusive` needs none, since
# its exclusion is the share mode. The Wdk and kernel features give the layout of the data the
# kernel shares with every process, whose boot sequence number is `OsFs::boot_identity`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Wdk_System_SystemServices", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel"] }
# The event behind `EventSignal`, and the platform's wait on it.
win-sync-sys = "0.1.0"
# The thread-pool wait behind `EventSignal::watch`; 0.4.1 is the first that takes a wait-only handle.
windows-threadpool-sys = "0.4.1"
